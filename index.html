<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>HR Management System</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:#f7f6f3;color:#333;}
.app{display:flex;min-height:100vh;}

.sidebar{width:240px;min-height:100vh;background:#1a1a2e;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;flex-shrink:0;}
.sidebar-brand{padding:24px 20px 16px;border-bottom:1px solid rgba(255,255,255,.08);}
.sidebar-brand h1{font-size:15px;font-weight:600;color:#fff;letter-spacing:.02em;}
.sidebar-brand p{font-size:11px;color:rgba(255,255,255,.4);margin-top:2px;}
.org-selector{padding:12px 20px;border-bottom:1px solid rgba(255,255,255,.08);}
.org-selector label{font-size:10px;color:rgba(255,255,255,.4);letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:6px;}
.org-selector select{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#fff;font-family:'DM Sans',sans-serif;font-size:13px;padding:7px 10px;border-radius:6px;cursor:pointer;}
.sidebar-nav{padding:8px 0;flex:1;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;color:rgba(255,255,255,.55);font-size:13px;cursor:pointer;transition:all .15s;border-left:2px solid transparent;user-select:none;}
.nav-item:hover{color:#fff;background:rgba(255,255,255,.06);}
.nav-item.active{color:#7c9eff;background:rgba(124,158,255,.1);border-left-color:#7c9eff;}

/* Connection panel */
.conn-panel{padding:12px 16px;border-top:1px solid rgba(255,255,255,.08);}
.conn-status{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.conn-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;transition:background .3s;}
.conn-dot.demo{background:#f59e0b;}
.conn-dot.live{background:#22c55e;box-shadow:0 0 6px rgba(34,197,94,.5);}
.conn-dot.error{background:#ef4444;}
.conn-dot.testing{background:#7c9eff;animation:blink .8s ease-in-out infinite alternate;}
@keyframes blink{from{opacity:.3;}to{opacity:1;}}
.conn-info strong{display:block;font-size:11px;font-weight:600;color:#fff;}
.conn-info span{font-size:10px;color:rgba(255,255,255,.45);}
.conn-btn{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.75);font-family:'DM Sans',sans-serif;font-size:12px;padding:7px 10px;border-radius:6px;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:6px;}
.conn-btn:hover{background:rgba(255,255,255,.15);color:#fff;}

/* Main */
.main{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{background:#fff;border-bottom:1px solid #eee;padding:16px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;}
.topbar h2{font-size:18px;font-weight:600;color:#1a1a2e;}
.content{padding:24px 28px;}

/* Cards */
.card{background:#fff;border-radius:10px;border:1px solid #eee;overflow:hidden;margin-bottom:16px;}
.card-header{padding:14px 20px;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.card-header h3{font-size:14px;font-weight:600;color:#333;}

/* Table */
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{padding:9px 16px;text-align:left;font-size:11px;font-weight:500;color:#888;letter-spacing:.06em;text-transform:uppercase;background:#fafafa;border-bottom:1px solid #f0f0f0;white-space:nowrap;}
tbody tr{border-bottom:1px solid #f8f8f8;transition:background .1s;}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:#fafbff;}
tbody td{padding:11px 16px;color:#444;vertical-align:middle;}
tfoot td{padding:11px 16px;font-weight:600;background:#f7f6f3;border-top:2px solid #eee;}
.tr{text-align:right;}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 14px;border-radius:7px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;border:none;}
.btn:disabled{opacity:.6;cursor:not-allowed;}
.btn-primary{background:#1a1a2e;color:#fff;}
.btn-primary:hover:not(:disabled){background:#252545;}
.btn-secondary{background:#f3f4f6;color:#333;}
.btn-secondary:hover{background:#e8e9ec;}
.btn-ghost{background:transparent;color:#666;padding:6px 8px;}
.btn-ghost:hover{background:#f3f4f6;color:#333;}
.btn-blue{background:#eff6ff;color:#1d4ed8;}
.btn-blue:hover{background:#dbeafe;}
.btn-red{background:#fee2e2;color:#991b1b;}
.btn-red:hover{background:#fecaca;}
.btn-sm{padding:5px 10px;font-size:12px;}

/* Badges */
.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:500;}
.bg{background:#dcfce7;color:#166534;}
.br{background:#fee2e2;color:#991b1b;}
.by{background:#fef9c3;color:#854d0e;}
.bb{background:#dbeafe;color:#1d4ed8;}
.bgy{background:#f3f4f6;color:#4b5563;}
.bp{background:#ede9fe;color:#6d28d9;}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:#fff;border-radius:12px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2);}
.modal-wide{max-width:680px;}
.modal-hdr{padding:18px 22px 14px;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:1;}
.modal-hdr h3{font-size:15px;font-weight:600;color:#1a1a2e;}
.modal-body{padding:18px 22px;}
.modal-foot{padding:12px 22px;border-top:1px solid #f0f0f0;display:flex;justify-content:flex-end;gap:8px;}

/* Forms */
.form-row{display:grid;gap:12px;margin-bottom:12px;}
.c2{grid-template-columns:1fr 1fr;}
.c3{grid-template-columns:1fr 1fr 1fr;}
.fg{display:flex;flex-direction:column;gap:4px;}
.fg label{font-size:12px;font-weight:500;color:#555;}
.fg input,.fg select,.fg textarea{padding:8px 11px;border:1px solid #e0e0e0;border-radius:7px;font-family:'DM Sans',sans-serif;font-size:13px;color:#333;background:#fff;outline:none;transition:border-color .15s;width:100%;}
.fg input:focus,.fg select:focus{border-color:#7c9eff;}

/* Stats */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
.stat-card{background:#fff;border:1px solid #eee;border-radius:10px;padding:16px 18px;}
.stat-label{font-size:11px;color:#888;margin-bottom:5px;font-weight:500;}
.stat-value{font-size:22px;font-weight:600;color:#1a1a2e;}
.stat-sub{font-size:11px;color:#aaa;margin-top:2px;}

/* Salary Slip */
.slip{background:#fff;border:1px solid #e0e0e0;border-radius:10px;overflow:hidden;}
.slip-hdr{background:linear-gradient(135deg,#1a1a2e,#16213e);padding:22px;color:#fff;}
.slip-hdr h2{font-size:19px;font-weight:600;margin-bottom:3px;}
.slip-hdr p{font-size:12px;opacity:.6;}
.slip-meta{display:grid;grid-template-columns:1fr 1fr;gap:5px 20px;font-size:12px;margin-top:14px;}
.slip-body{padding:20px 22px;}
.slip-section{margin-bottom:18px;}
.slip-section h4{font-size:11px;font-weight:600;color:#888;letter-spacing:.07em;text-transform:uppercase;margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid #eee;}
.slip-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed #f0f0f0;font-size:13px;}
.slip-row:last-child{border:none;}
.slip-row .lbl{color:#888;}
.slip-row .val{font-weight:500;}
.ded-item{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;background:#fef2f2;border-radius:6px;margin-bottom:5px;}
.ded-type{font-size:12px;font-weight:500;color:#444;}
.ded-desc{font-size:11px;color:#888;margin-top:1px;}
.ded-amt{font-size:13px;font-weight:600;color:#dc2626;font-family:'DM Mono',monospace;white-space:nowrap;padding-left:12px;}
.slip-total{background:#f7f6f3;border-radius:8px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;margin-top:10px;}
.slip-total .lbl{font-size:14px;font-weight:600;color:#333;}
.slip-total .amt{font-size:22px;font-weight:700;color:#1a1a2e;font-family:'DM Mono',monospace;}

/* Report */
.report-filter{display:flex;align-items:center;gap:12px;padding:14px 20px;background:#fafafa;border-bottom:1px solid #f0f0f0;flex-wrap:wrap;}
.report-filter label{font-size:12px;font-weight:500;color:#555;}
.report-filter select{padding:6px 10px;border:1px solid #e0e0e0;border-radius:6px;font-family:'DM Sans',sans-serif;font-size:13px;color:#333;background:#fff;outline:none;}
.rsum{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:16px 20px;border-bottom:1px solid #f0f0f0;background:#fafbff;}
.rsum-card{background:#fff;border:1px solid #eee;border-radius:8px;padding:12px 14px;}
.rsum-label{font-size:11px;color:#888;margin-bottom:3px;}
.rsum-val{font-size:16px;font-weight:600;color:#1a1a2e;}

/* Settings */
.settings-section{padding:22px 24px;border-bottom:1px solid #f5f5f5;}
.settings-section:last-child{border-bottom:none;}
.settings-section h3{font-size:14px;font-weight:600;color:#1a1a2e;margin-bottom:4px;}
.settings-section p{font-size:13px;color:#888;margin-bottom:14px;line-height:1.6;}
.mode-toggle{display:flex;gap:10px;}
.mode-opt{flex:1;padding:14px 10px;border:2px solid #eee;border-radius:9px;cursor:pointer;text-align:center;transition:all .15s;user-select:none;}
.mode-opt:hover{border-color:#c7d2fe;}
.mode-opt.sel{border-color:#7c9eff;background:#eff6ff;}
.mode-opt .mo-icon{font-size:22px;margin-bottom:5px;}
.mode-opt .mo-title{font-size:13px;font-weight:600;color:#333;}
.mode-opt .mo-sub{font-size:11px;color:#888;margin-top:2px;}
.url-row{display:flex;gap:8px;}
.url-row input{flex:1;padding:9px 12px;border:1px solid #e0e0e0;border-radius:7px;font-family:'DM Mono',monospace;font-size:12px;color:#333;outline:none;transition:border-color .15s;}
.url-row input:focus{border-color:#7c9eff;}
.sbox{border-radius:8px;padding:12px 14px;font-size:13px;margin-top:12px;line-height:1.5;}
.sbox.info{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;}
.sbox.ok{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;}
.sbox.err{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;}
.sbox.warn{background:#fffbeb;border:1px solid #fde68a;color:#92400e;}
.step-list{list-style:none;padding:0;counter-reset:step;}
.step-list li{counter-increment:step;display:flex;gap:12px;margin-bottom:11px;font-size:13px;color:#555;line-height:1.55;}
.step-list li::before{content:counter(step);background:#1a1a2e;color:#fff;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;margin-top:1px;}
.step-list code{background:#f3f4f6;padding:1px 6px;border-radius:4px;font-family:'DM Mono',monospace;font-size:12px;color:#1a1a2e;}

/* Utils */
.flex{display:flex;align-items:center;}
.gap8{gap:8px;}
.mono{font-family:'DM Mono',monospace;}
.muted{color:#888;font-size:12px;}
.bold{font-weight:600;}
.red{color:#dc2626;}
.green{color:#16a34a;}
.avt{width:32px;height:32px;border-radius:50%;background:#ede9fe;color:#6d28d9;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.hint{background:#f7f6f3;border-radius:7px;padding:9px 13px;font-size:13px;color:#555;margin-bottom:12px;}
.empty{padding:40px;text-align:center;color:#ccc;}
.empty p{font-size:14px;margin-top:8px;}
.hidden{display:none!important;}
.adv-card{background:#fff7ed;border-radius:7px;padding:8px 10px;margin-bottom:6px;font-size:12px;}
.adv-card .an{font-weight:500;margin-bottom:2px;}
.adv-card .am{color:#666;}
.two-col{display:grid;grid-template-columns:310px 1fr;gap:18px;align-items:start;}
.already-box{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:14px 16px;margin-bottom:12px;}
.already-box .ab-title{font-size:13px;font-weight:600;color:#166534;margin-bottom:2px;}
.already-box .ab-sub{font-size:12px;color:#4ade80;color:#166534;opacity:.8;}


/* Payment & Ledger */
.pay-btns{display:flex;gap:8px;margin-top:10px;}
.btn-cash{background:#f0fdf4;color:#166534;border:1.5px solid #86efac;}
.btn-cash:hover{background:#dcfce7;}
.btn-bank{background:#eff6ff;color:#1d4ed8;border:1.5px solid #93c5fd;}
.btn-bank:hover{background:#dbeafe;}
.pay-status{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:8px;margin-top:10px;font-size:13px;}
.pay-status.paid-cash{background:#f0fdf4;border:1px solid #86efac;color:#166534;}
.pay-status.paid-bank{background:#eff6ff;border:1px solid #93c5fd;color:#1d4ed8;}
.pay-status.unpaid{background:#fef9c3;border:1px solid #fde047;color:#854d0e;}
.slip-pay-section{border-top:1px solid #eee;padding-top:14px;margin-top:14px;}
.ledger-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f5f5f5;font-size:13px;}
.ledger-row:last-child{border-bottom:none;}
.ledger-credit{color:#16a34a;font-weight:600;font-family:'DM Mono',monospace;}
.ledger-debit{color:#dc2626;font-weight:600;font-family:'DM Mono',monospace;}
.ledger-bal{font-weight:700;font-family:'DM Mono',monospace;}
.ledger-bal.neg{color:#dc2626;}
.ledger-bal.pos{color:#16a34a;}
.ledger-bal.zero{color:#888;}
.emp-bal-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600;font-family:'DM Mono',monospace;}
.emp-bal-badge.neg{background:#fee2e2;color:#991b1b;}
.emp-bal-badge.zero{background:#f3f4f6;color:#6b7280;}

/* Adhoc payment panel in ledger */
.adhoc-panel{background:#f8faff;border:1px solid #dbeafe;border-radius:10px;padding:16px 18px;margin-bottom:14px;}
.adhoc-panel h4{font-size:13px;font-weight:600;color:#1e40af;margin-bottom:12px;display:flex;align-items:center;gap:7px;}
.adhoc-alloc{margin-top:14px;border-top:1px solid #e0e9ff;padding-top:12px;}
.adhoc-alloc-title{font-size:11px;font-weight:600;color:#888;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px;}
.alloc-row{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;background:#fff;border:1px solid #eef2ff;border-radius:7px;margin-bottom:5px;font-size:13px;}
.alloc-row .ar-month{font-weight:500;color:#333;}
.alloc-row .ar-due{color:#888;font-size:12px;}
.alloc-row .ar-alloc{font-weight:600;color:#16a34a;font-family:"DM Mono",monospace;}
.alloc-row .ar-remain{font-size:11px;color:#888;font-family:"DM Mono",monospace;}
.alloc-row.fully-paid{background:#f0fdf4;border-color:#bbf7d0;}
.alloc-row.partly-paid{background:#fffbeb;border-color:#fde68a;}
.alloc-row.unpaid{background:#fff;}
.fifo-summary{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:10px 14px;margin-top:10px;font-size:13px;color:#166534;}
.fifo-summary.partial{background:#fffbeb;border-color:#fde68a;color:#854d0e;}

/* ── MOBILE ──────────────────────────────────────────────── */
.mob-nav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:#1a1a2e;border-top:1px solid rgba(255,255,255,.1);
  padding-bottom:env(safe-area-inset-bottom,0px);}
.mob-nav-inner{display:flex;}
.mob-nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;padding:8px 2px 6px;color:rgba(255,255,255,.4);font-size:9px;
  background:none;border:none;cursor:pointer;font-family:"DM Sans",sans-serif;min-height:52px;transition:color .15s;}
.mob-nav-btn.active{color:#7c9eff;}
.mob-topbar{display:none;background:#1a1a2e;height:54px;align-items:center;
  justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:50;}
.mob-topbar-title{font-size:15px;font-weight:600;color:#fff;}
.mob-org-pill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:5px 10px 5px 8px;
  cursor:pointer;max-width:160px;}
.mob-org-pill-dot{width:7px;height:7px;border-radius:50%;background:#f59e0b;flex-shrink:0;}
.mob-org-pill-dot.live{background:#22c55e;}
.mob-org-pill-dot.error{background:#ef4444;}
.mob-org-pill-name{font-size:12px;color:rgba(255,255,255,.85);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;}
.org-sheet-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;}
.org-sheet{position:fixed;bottom:0;left:0;right:0;background:#1a1a2e;
  border-radius:20px 20px 0 0;z-index:201;
  transform:translateY(100%);transition:transform .28s ease;
  padding-bottom:env(safe-area-inset-bottom,16px);}
.org-sheet.open{transform:translateY(0);}
.org-sheet-handle{width:36px;height:4px;background:rgba(255,255,255,.2);
  border-radius:2px;margin:14px auto 12px;}
.org-sheet-ttl{font-size:12px;font-weight:600;color:rgba(255,255,255,.4);
  letter-spacing:.08em;text-transform:uppercase;padding:0 20px 10px;}
.org-sheet-item{display:flex;align-items:center;gap:10px;padding:13px 20px;
  color:#fff;font-size:14px;cursor:pointer;}
.org-sheet-item.sel{color:#7c9eff;}
.org-sheet-dot{width:8px;height:8px;border-radius:50%;background:#f59e0b;flex-shrink:0;}
.org-sheet-dot.live{background:#22c55e;}
.org-sheet-add{display:flex;align-items:center;gap:10px;padding:13px 20px;
  color:rgba(255,255,255,.5);font-size:14px;cursor:pointer;
  border-top:1px solid rgba(255,255,255,.08);margin-top:6px;}
.tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}

@media(max-width:768px){
  .sidebar{display:none!important;}
  .topbar{display:none!important;}
  .mob-topbar{display:flex!important;}
  .mob-nav{display:block!important;}
  .main{padding-bottom:calc(52px + env(safe-area-inset-bottom,0px));}
  .content{padding:14px 14px 8px;}
  .card{border-radius:8px;margin-bottom:12px;}
  .card-header{padding:12px 14px;}
  .stats-grid{grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .stat-value{font-size:18px;}
  .two-col{grid-template-columns:1fr;gap:12px;}
  .c2{grid-template-columns:1fr;}
  .c3{grid-template-columns:1fr;}
  .fg input,.fg select,.fg textarea{font-size:16px!important;padding:10px 12px;}
  .overlay{padding:0;align-items:flex-end;}
  .modal{border-radius:16px 16px 0 0;max-height:92vh;max-width:100%;}
  .rsum{grid-template-columns:1fr 1fr;gap:8px;padding:12px 14px;}
  .report-filter{padding:10px 14px;gap:8px;}
  .url-row{flex-direction:column;}
  .pay-btns{flex-direction:column;}
}
@media print{
  .sidebar,.topbar,.mob-nav,.mob-topbar,.no-print{display:none!important;}
  .main{padding-bottom:0!important;}
  .content{padding:0;}
  .slip{border:none;}
}

</style>
</head>
<body>
<!-- Mobile top bar -->
<div class="mob-topbar" id="mobTopbar">
  <div class="mob-topbar-title" id="mobPageTitle">Dashboard</div>
  <div class="mob-org-pill" id="mobOrgPill">
    <div class="mob-org-pill-dot" id="mobOrgDot"></div>
    <div class="mob-org-pill-name" id="mobOrgName">Loading...</div>
  </div>
</div>
<!-- Mobile org sheet -->
<div class="org-sheet-bg hidden" id="orgSheetBg"></div>
<div class="org-sheet" id="orgSheet">
  <div class="org-sheet-handle"></div>
  <div class="org-sheet-ttl">Switch Organisation</div>
  <div id="orgSheetList"></div>
  <div class="org-sheet-add" id="orgSheetAdd">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    Add New Organisation
  </div>
</div>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <h1>HR Manager</h1>
      <p>Multi-org payroll system</p>
    </div>
    <div class="org-selector">
      <label>Organisation</label>
      <select id="orgSelect"></select>

<script>
// ── CONFIG ──────────────────────────────────────────────────
// Single-org config (backward compat): hr_cfg = {url, mode}
var _cfg = (function(){ try{ return JSON.parse(localStorage.getItem("hr_cfg")||"{}"); }catch(e){ return {}; } })();
var GAS_URL  = _cfg.url  || "";
var USE_MOCK = (_cfg.mode !== "live");

// Multi-org config: hr_orgs = { orgId: {name, url, mode} }
function loadOrgCfg(){ try{ return JSON.parse(localStorage.getItem("hr_orgs")||"{}"); }catch(e){ return {}; } }
function saveOrgCfg(cfg){ localStorage.setItem("hr_orgs",JSON.stringify(cfg)); }
var ORG_CFG = loadOrgCfg();

// Switch active connection to the given org
function setActiveOrg(orgId){
  var cfg=ORG_CFG[orgId]||{};
  if(cfg.url&&cfg.mode==="live"){
    GAS_URL=cfg.url;
    USE_MOCK=false;
    _cfg.url=cfg.url;_cfg.mode="live";
  } else {
    // No URL or demo mode — use mock
    GAS_URL="";
    USE_MOCK=true;
  }
}

var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
var CY = new Date().getFullYear();
var CM = new Date().getMonth() + 1;

// ── MOCK STORE (empty — data comes from Google Sheets) ────────
var STORE = {
  orgs:[],
  employees:{},
  advances:{},
  deductions:{},
  leaves:{},
  slips:{},
  payments:{},
  _n:100
};
function nid(){ return "X"+(++STORE._n); }
function ga(obj,k){ if(!obj[k]) obj[k]=[]; return obj[k]; }

// ── MOCK API ──────────────────────────────────────────────────
async function mockApi(ac,d){
  d=d||{};
  await new Promise(function(r){setTimeout(r,120);});

  if(ac==="getOrganisations") return {success:true,data:STORE.orgs.slice()};
  if(ac==="addOrganisation"){
    var o={orgId:nid(),orgName:d.orgName};
    STORE.orgs.push(o);
    return {success:true,orgId:o.orgId};
  }

  if(ac==="getEmployees"){
    return {success:true,data:(ga(STORE.employees,d.org)).filter(function(e){return e.status!=="Inactive";})};
  }
  if(ac==="addEmployee"){
    var e={empId:nid(),name:d.name,designation:d.designation||"",department:d.department||"",
      basicSalary:parseFloat(d.basicSalary)||0,hra:parseFloat(d.hra)||0,otherAllowances:parseFloat(d.otherAllowances)||0,
      joiningDate:d.joiningDate||"",contactNumber:d.contactNumber||"",email:d.email||"",status:"Active"};
    ga(STORE.employees,d.orgId).push(e);
    return {success:true,empId:e.empId};
  }
  if(ac==="updateEmployee"){
    var L=ga(STORE.employees,d.orgId);
    for(var i=0;i<L.length;i++){
      if(L[i].empId===d.empId){
        L[i].name=d.name;L[i].designation=d.designation||"";L[i].department=d.department||"";
        L[i].basicSalary=parseFloat(d.basicSalary)||0;L[i].hra=parseFloat(d.hra)||0;
        L[i].otherAllowances=parseFloat(d.otherAllowances)||0;
        L[i].joiningDate=d.joiningDate||"";L[i].contactNumber=d.contactNumber||"";L[i].email=d.email||"";
        break;
      }
    }
    return {success:true};
  }
  if(ac==="deleteEmployee"){
    var L=ga(STORE.employees,d.orgId);
    for(var i=0;i<L.length;i++){if(L[i].empId===d.empId){L[i].status="Inactive";break;}}
    return {success:true};
  }

  if(ac==="recordLeave"){
    var L=ga(STORE.leaves,d.orgId),found=false;
    for(var i=0;i<L.length;i++){
      if(L[i].empId===d.empId&&L[i].month==d.month&&L[i].year==d.year){
        L[i].leaveDays=d.leaveDays;L[i].leaveType=d.leaveType;found=true;break;
      }
    }
    if(!found) L.push({orgId:d.orgId,empId:d.empId,month:parseInt(d.month),year:parseInt(d.year),leaveDays:parseFloat(d.leaveDays)||0,leaveType:d.leaveType||""});
    return {success:true};
  }

  if(ac==="getAdvances"){
    var L=ga(STORE.advances,d.orgId);
    return {success:true,data:d.empId?L.filter(function(a){return a.empId===d.empId;}):L.slice()};
  }
  if(ac==="addAdvance"){
    ga(STORE.advances,d.orgId).push({advanceId:nid(),orgId:d.orgId,empId:d.empId,
      date:new Date().toISOString(),amount:parseFloat(d.amount)||0,description:d.description,
      totalDeducted:0,status:"Active",monthlyDeduction:parseFloat(d.monthlyDeduction)||0,
      deductionType:d.deductionType||"scheduled"});
    return {success:true};
  }

  if(ac==="getDeductions"){
    var L=ga(STORE.deductions,d.orgId);
    return {success:true,data:d.empId?L.filter(function(x){return x.empId===d.empId;}):L.slice()};
  }
  if(ac==="addDeduction"){
    ga(STORE.deductions,d.orgId).push({dedId:nid(),orgId:d.orgId,empId:d.empId,
      month:parseInt(d.month),year:parseInt(d.year),amount:parseFloat(d.amount)||0,
      description:d.description,type:d.type||"adhoc"});
    return {success:true};
  }

  if(ac==="deleteSlip"){
    var L=ga(STORE.slips,d.orgId);
    STORE.slips[d.orgId]=L.filter(function(s){return s.slipId!==d.slipId;});
    return {success:true};
  }

  if(ac==="getSalarySlips"){
    var L=ga(STORE.slips,d.orgId).slice();
    if(d.empId) L=L.filter(function(s){return s.empId===d.empId;});
    if(d.month) L=L.filter(function(s){return s.month==d.month;});
    if(d.year)  L=L.filter(function(s){return s.year==d.year;});
    return {success:true,data:L};
  }

  if(ac==="generateSalarySlip"){
    var orgId=d.orgId,empId=d.empId,month=parseInt(d.month),year=parseInt(d.year),wd=parseInt(d.workingDays)||26;
    var empList=ga(STORE.employees,orgId),emp=null;
    for(var i=0;i<empList.length;i++){if(empList[i].empId===empId){emp=empList[i];break;}}
    if(!emp) return {success:false,error:"Employee not found"};

    var gr=(parseFloat(emp.basicSalary)||0)+(parseFloat(emp.hra)||0)+(parseFloat(emp.otherAllowances)||0);
    var lv=ga(STORE.leaves,orgId),ld=0;
    for(var i=0;i<lv.length;i++){if(lv[i].empId===empId&&lv[i].month===month&&lv[i].year===year){ld=parseFloat(lv[i].leaveDays)||0;break;}}

    var perDay=gr/wd,lded=parseFloat((ld*perDay).toFixed(2)),details=[];
    if(ld>0) details.push({type:"Leave Deduction",description:ld+" day(s) @ \u20b9"+Math.round(perDay)+"/day",amount:lded});

    var advs=ga(STORE.advances,orgId),advDed=0;
    for(var i=0;i<advs.length;i++){
      var a=advs[i];
      if(a.empId!==empId||a.status!=="Active") continue;
      var rem=a.amount-a.totalDeducted;if(rem<=0) continue;
      var ded=(a.deductionType==="scheduled")?Math.min(a.monthlyDeduction,rem):rem;
      ded=parseFloat(ded.toFixed(2));advDed+=ded;
      a.totalDeducted=parseFloat((a.totalDeducted+ded).toFixed(2));
      if(a.totalDeducted>=a.amount) a.status="Cleared";
      details.push({type:a.deductionType==="adhoc"?"Advance (Adhoc)":"Advance (Monthly)",description:a.description,amount:ded});
    }

    var deds=ga(STORE.deductions,orgId),oDed=0;
    for(var i=0;i<deds.length;i++){
      var x=deds[i];
      if(x.empId===empId&&x.month===month&&x.year===year){oDed+=x.amount;details.push({type:"Other Deduction",description:x.description,amount:x.amount});}
    }

    var totDed=parseFloat((lded+advDed+oDed).toFixed(2)),net=parseFloat((gr-totDed).toFixed(2));
    var slip={slipId:"SLIP_"+empId+"_"+month+"_"+year,orgId:orgId,empId:empId,empName:emp.name,
      month:month,year:year,basicSalary:parseFloat(emp.basicSalary)||0,hra:parseFloat(emp.hra)||0,
      otherAllowances:parseFloat(emp.otherAllowances)||0,grossSalary:gr,leaveDays:ld,
      leaveDeduction:lded,advanceDeduction:advDed,otherDeductions:oDed,
      totalDeductions:totDed,netSalary:net,deductionDetails:details,workingDays:wd,
      generatedAt:new Date().toISOString()};

    var slips=ga(STORE.slips,orgId),found=false;
    for(var i=0;i<slips.length;i++){
      if(slips[i].empId===empId&&slips[i].month===month&&slips[i].year===year){slips[i]=slip;found=true;break;}
    }
    if(!found) slips.push(slip);
    return {success:true,slip:slip};
  }

  if(ac==="recordPayment"){
    // d: {orgId, slipId, empId, amount, method, paidAt}
    if(!STORE.payments[d.orgId]) STORE.payments[d.orgId]=[];
    // Remove any existing payment for this slip
    STORE.payments[d.orgId]=STORE.payments[d.orgId].filter(function(p){return p.slipId!==d.slipId;});
    STORE.payments[d.orgId].push({
      payId:nid(),orgId:d.orgId,empId:d.empId,slipId:d.slipId,
      amount:parseFloat(d.amount)||0,method:d.method||"cash",
      paidAt:d.paidAt||new Date().toISOString()
    });
    return {success:true};
  }
  if(ac==="undoPayment"){
    if(STORE.payments[d.orgId])
      STORE.payments[d.orgId]=STORE.payments[d.orgId].filter(function(p){return p.slipId!==d.slipId;});
    return {success:true};
  }
  if(ac==="getPayments"){
    var P=STORE.payments[d.orgId]||[];
    if(d.empId) P=P.filter(function(p){return p.empId===d.empId;});
    if(d.slipId) P=P.filter(function(p){return p.slipId===d.slipId;});
    return {success:true,data:P.slice()};
  }
  if(ac==="getLedger"){
    // Returns per-employee balance = sum(netSalary) - sum(payments)
    var orgId=d.orgId;
    var slips=ga(STORE.slips,orgId);
    var pays=STORE.payments[orgId]||[];
    // Group by empId
    var empIds={};
    slips.forEach(function(s){empIds[s.empId]=true;});
    var rows=[];
    Object.keys(empIds).forEach(function(empId){
      if(d.empId&&d.empId!==empId) return;
      var empSlips=slips.filter(function(s){return s.empId===empId;});
      var empPays=pays.filter(function(p){return p.empId===empId;});
      var totalEarned=empSlips.reduce(function(s,x){return s+x.netSalary;},0);
      var totalPaid=empPays.reduce(function(s,p){return s+p.amount;},0);
      var balance=parseFloat((totalEarned-totalPaid).toFixed(2));
      rows.push({empId:empId,totalEarned:totalEarned,totalPaid:totalPaid,balance:balance});
    });
    return {success:true,data:rows};
  }
  if(ac==="getEmpLedger"){
    // Detailed ledger for one employee: slip entries + payment entries chronologically
    var orgId=d.orgId,empId=d.empId;
    var slips=ga(STORE.slips,orgId).filter(function(s){return s.empId===empId;});
    var pays=(STORE.payments[orgId]||[]).filter(function(p){return p.empId===empId;});
    var entries=[];
    slips.forEach(function(s){
      entries.push({date:s.generatedAt,description:"Salary "+MONTHS[s.month-1]+" "+s.year,
        credit:s.netSalary,debit:0,type:"salary",ref:s.slipId});
    });
    pays.forEach(function(p){
      entries.push({date:p.paidAt,description:"Payment ("+p.method+")",
        credit:0,debit:p.amount,type:"payment",ref:p.payId});
    });
    entries.sort(function(a,b){return new Date(a.date)-new Date(b.date);});
    // compute running balance
    var bal=0;
    entries.forEach(function(e){bal+=e.credit-e.debit;e.balance=parseFloat(bal.toFixed(2));});
    return {success:true,data:entries};
  }
  if(ac==="recordAdhocPayment"){
    // FIFO allocation: distribute payment across oldest unpaid slips first
    // d: {orgId, empId, amount, method, paidAt, allocations:[{slipId, amount}]}
    var orgId=d.orgId;
    if(!STORE.payments[orgId]) STORE.payments[orgId]=[];
    var paidAt=d.paidAt||new Date().toISOString();
    var allocs=d.allocations||[];
    allocs.forEach(function(al){
      if(!al.amount||al.amount<=0) return;
      // Remove existing payment for this slip then add new partial/full
      STORE.payments[orgId]=STORE.payments[orgId].filter(function(p){return p.slipId!==al.slipId;});
      STORE.payments[orgId].push({
        payId:nid(),orgId:orgId,empId:d.empId,slipId:al.slipId,
        amount:parseFloat(al.amount),method:d.method||"cash",paidAt:paidAt,
        isAdhoc:true,adhocNote:d.note||""
      });
    });
    return {success:true};
  }
  if(ac==="getEmpSlipsPending"){
    // Returns unpaid/partially-paid slips for an employee in chronological order (oldest first)
    var orgId=d.orgId,empId=d.empId;
    var slips=ga(STORE.slips,orgId).filter(function(s){return s.empId===empId;});
    var pays=(STORE.payments[orgId]||[]).filter(function(p){return p.empId===empId;});
    // Map slipId -> paid amount
    var paidMap={};
    pays.forEach(function(p){ paidMap[p.slipId]=(paidMap[p.slipId]||0)+p.amount; });
    // Sort slips oldest first (by year then month)
    slips.sort(function(a,b){
      if(a.year!==b.year) return a.year-b.year;
      return a.month-b.month;
    });
    var result=slips.map(function(s){
      var paid=paidMap[s.slipId]||0;
      var outstanding=parseFloat((s.netSalary-paid).toFixed(2));
      return {
        slipId:s.slipId,month:s.month,year:s.year,
        netSalary:s.netSalary,paidAmount:paid,
        outstanding:outstanding,
        status:outstanding<=0?"paid":(paid>0?"partial":"unpaid")
      };
    }).filter(function(s){return s.outstanding>0;}); // only unpaid/partial
    return {success:true,data:result};
  }
  return {success:false,error:"Unknown: "+ac};
}

// ── REAL API ──────────────────────────────────────────────────
// GAS Web Apps:
//   - doGet  → read operations via query string
//   - doPost → write operations via JSON body
// IMPORTANT: GAS deployed as "Anyone" handles CORS automatically.
// We use no-cors only as a last resort fallback for fire-and-forget writes.

async function gasGet(params){
  // Remove undefined/null/empty params to avoid GAS confusion
  var clean={};
  Object.keys(params).forEach(function(k){
    if(params[k]!==undefined&&params[k]!==null&&params[k]!=="")
      clean[k]=params[k];
  });
  var qs=Object.keys(clean).map(function(k){
    return encodeURIComponent(k)+"="+encodeURIComponent(clean[k]);
  }).join("&");
  var r=await fetch(GAS_URL+"?"+qs,{method:"GET"});
  var data=await r.json();
  return normaliseGasResponse(data);
}

async function gasPost(body){
  var r=await fetch(GAS_URL,{
    method:"POST",
    headers:{"Content-Type":"text/plain"}, // avoid CORS preflight
    body:JSON.stringify(body)
  });
  var data=await r.json();
  return normaliseGasResponse(data);
}

// GAS sometimes returns string-encoded JSON fields — normalise them
function normaliseGasResponse(data){
  if(!data) return {success:false,error:"No response"};
  // If data array contains items with string deductionDetails, parse them
  if(data.data&&Array.isArray(data.data)){
    data.data=data.data.map(function(item){
      if(item&&typeof item.deductionDetails==="string"){
        try{item.deductionDetails=JSON.parse(item.deductionDetails);}catch(e){item.deductionDetails=[];}
      }
      return item;
    });
  }
  // For single slip response
  if(data.slip&&typeof data.slip.deductionDetails==="string"){
    try{data.slip.deductionDetails=JSON.parse(data.slip.deductionDetails);}catch(e){data.slip.deductionDetails=[];}
  }
  return data;
}

var GET_ACTIONS=["getOrganisations","getEmployees","getSalarySlips","getAdvances","getDeductions","getPayments","getLedger","getEmpLedger","getEmpSlipsPending"];

async function realApi(ac,p){
  p=p||{};
  try{
    if(GET_ACTIONS.indexOf(ac)>-1){
      p.action=ac;
      return await gasGet(p);
    }else{
      p.action=ac;
      return await gasPost(p);
    }
  }catch(e){
    console.error("GAS API error ["+ac+"]:",e);
    return {success:false,error:e.message};
  }
}

async function call(ac,p){
  // Always route through real API when a URL is configured for the current org
  return USE_MOCK ? mockApi(ac,p||{}) : realApi(ac,p||{});
}

// callWithUrl: direct call to a specific GAS URL (used for new-org creation)
async function callWithUrl(url,ac,p){
  p=p||{};p.action=ac;
  try{
    if(GET_ACTIONS.indexOf(ac)>-1){
      var clean={};
      Object.keys(p).forEach(function(k){if(p[k]!==undefined&&p[k]!==null&&p[k]!=="")clean[k]=p[k];});
      var qs=Object.keys(clean).map(function(k){return encodeURIComponent(k)+"="+encodeURIComponent(clean[k]);}).join("&");
      var r=await fetch(url+"?"+qs,{method:"GET"});
      var data=await r.json();
      return normaliseGasResponse(data);
    } else {
      var r=await fetch(url,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify(p)});
      var data=await r.json();
      return normaliseGasResponse(data);
    }
  }catch(e){
    console.error("callWithUrl error ["+ac+"]:",e);
    return {success:false,error:e.message};
  }
}

// ── LIVE SLIP CHECK ───────────────────────────────────────────
// In live mode, we cache fetched slips here so checkExistingSlip works
var LIVE_SLIPS_CACHE={}; // key: "orgId_empId_month_year" -> slip
var PAY_CACHE={};       // slipId -> payment object
var SLIP_REGISTRY={};   // slipId -> slip object (avoids onclick quoting)

async function fetchAndCacheSlip(orgId,empId,month,year){
  var key=orgId+"_"+empId+"_"+month+"_"+year;
  try{
    var res=await call("getSalarySlips",{orgId:orgId,empId:empId,month:month,year:year});
    var slips=res.data||[];
    if(slips.length>0){
      var slip=slips[0];
      // Ensure orgId is always present on cached slip
      if(!slip.orgId) slip.orgId=orgId;
      LIVE_SLIPS_CACHE[key]=slip;
      return slip;
    }
    else{delete LIVE_SLIPS_CACHE[key];return null;}
  }catch(e){return null;}
}

var S={
  orgs:[],selectedOrg:null,view:"dashboard",employees:[],
  sf:{month:CM,year:CY,workingDays:26,leaveDays:0,leaveType:"Unpaid",empId:""},
  lastSlip:null,advFilter:"Active",rpt:{month:CM,year:CY},
  connOk:false,reportSlips:[]
};

// ── HELPERS ───────────────────────────────────────────────────
function fmt(n){return "\u20b9"+parseFloat(n||0).toLocaleString("en-IN",{minimumFractionDigits:2});}
function fmtk(n){return "\u20b9"+parseFloat(n||0).toLocaleString("en-IN");}
function gross(e){return (parseFloat(e.basicSalary)||0)+(parseFloat(e.hra)||0)+(parseFloat(e.otherAllowances)||0);}
function inits(n){return n.split(" ").map(function(w){return w[0];}).join("").slice(0,2).toUpperCase();}
function gv(id){var el=document.getElementById(id);return el?el.value:"";}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function findEmp(id){for(var i=0;i<S.employees.length;i++){if(S.employees[i].empId===id)return S.employees[i];}return null;}

// slip for given emp/month/year — works for both mock and live mode
function existingSlipSync(orgId,empId,month,year){
  // Mock: check STORE
  if(USE_MOCK){
    var L=ga(STORE.slips,orgId);
    for(var i=0;i<L.length;i++){
      if(L[i].empId===empId&&L[i].month===parseInt(month)&&L[i].year===parseInt(year))return L[i];
    }
    return null;
  }
  // Live: check cache
  var key=orgId+"_"+empId+"_"+month+"_"+year;
  return LIVE_SLIPS_CACHE[key]||null;
}

  S.lastSlip=null;S.sf.empId="";

  LIVE_SLIPS_CACHE={};PAY_CACHE={};SLIP_REGISTRY={};
  if(S.selectedOrg){
    setActiveOrg(S.selectedOrg.orgId);
    localStorage.setItem("hr_last_org",S.selectedOrg.orgId);

async function saveOrg(){
  var url=(gv("newOrgUrl")||"").trim();
  if(!url){alert("Please enter the Apps Script URL.");return;}
  if(!url.startsWith("https://script.google.com")){alert("URL must start with https://script.google.com");return;}
  var btn=document.getElementById("orgSaveBtn");
  if(btn){btn.disabled=true;btn.textContent="Connecting...";}

  try{
    // Step 1: Fetch org list from this GAS URL to get authoritative names + orgIds
    var r=await fetch(url+"?action=getOrganisations");
    if(!r.ok) throw new Error("HTTP "+r.status);
    var data=await r.json();
    if(!data||data.success===false) throw new Error(data.error||"Bad response from Google Sheet");
    var gasOrgs=data.data||[];
    if(!gasOrgs.length) throw new Error("No organisations found in this Google Sheet. Run setupMasterSheets first.");

    // Step 2: Register ALL orgs from this GAS URL in ORG_CFG
    // This ensures the correct orgId-to-URL mapping (fixes the URL mismatch bug)
    gasOrgs.forEach(function(o){
      ORG_CFG[o.orgId]={name:o.orgName, url:url, mode:"live"};
    });
    saveOrgCfg(ORG_CFG);

    // Step 3: Merge into S.orgs (deduplicated by orgId)
    var seen={};
    S.orgs.forEach(function(o){seen[o.orgId]=o;});
    gasOrgs.forEach(function(o){seen[o.orgId]={orgId:o.orgId,orgName:o.orgName};});
    S.orgs=Object.values(seen);

    // Step 4: Switch to the first org from this sheet
    var newOrg=seen[gasOrgs[0].orgId];
    S.selectedOrg=newOrg;
    setActiveOrg(newOrg.orgId);
    S.connOk=true;
    localStorage.setItem("hr_last_org",newOrg.orgId);

    updateConn();
    renderOrgSelect();
    closeModal();
    renderContent();
  }catch(err){
    alert("Connection failed: "+err.message);
    if(btn){btn.disabled=false;btn.textContent="Connect";}
  }
}

// Edit/Delete org
var _editingOrgId=null;
function openEditOrgModal(orgId){
  var o=null;for(var i=0;i<S.orgs.length;i++){if(S.orgs[i].orgId===orgId){o=S.orgs[i];break;}}
  if(!o)return;
  _editingOrgId=orgId;
  var cfg=ORG_CFG[orgId]||{};
  openModal("Edit — "+esc(o.orgName),
    '<div class="fg" style="margin-bottom:10px"><label>Organisation Name <span class="muted">(fetched from Google Sheet)</span></label>'+
    '<input id="editOrgName" value="'+esc(o.orgName)+'" style="background:#f9f9f9;color:#888;" readonly/></div>'+
    '<div class="fg"><label>Apps Script URL</label>'+
    '<input type="url" id="editOrgUrl" class="mono" style="font-size:12px" value="'+esc(cfg.url||"")+'"/></div>'+
    '<div class="sbox warn" style="margin-top:10px;font-size:12px">To delete this organisation from the app (not from Google Sheets), use the Delete button below.</div>',
    '<button class="btn btn-red btn-sm" onclick="deleteOrg()">Delete</button>'+
    '<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>'+
    '<button class="btn btn-primary" onclick="saveEditOrg()">Save</button>'
  );
}
async function saveEditOrg(){
  var orgId=_editingOrgId;if(!orgId)return;
  var url=((document.getElementById("editOrgUrl")||{}).value||"").trim();

  // If new URL provided, re-fetch org names from GAS to update mapping
  if(url&&url!==( ORG_CFG[orgId]||{}).url){
    try{
      var r=await fetch(url+"?action=getOrganisations");
      var data=await r.json();
      if(data&&data.data){
        data.data.forEach(function(o){
          ORG_CFG[o.orgId]={name:o.orgName,url:url,mode:"live"};
          // Update name in S.orgs
          for(var i=0;i<S.orgs.length;i++){if(S.orgs[i].orgId===o.orgId){S.orgs[i].orgName=o.orgName;break;}}
        });
      }
    }catch(e){ /* keep existing */ }
  } else {
    if(!ORG_CFG[orgId]) ORG_CFG[orgId]={};
    ORG_CFG[orgId].url=url;
    ORG_CFG[orgId].mode=url?"live":"demo";
  }
  saveOrgCfg(ORG_CFG);

  if(S.selectedOrg&&S.selectedOrg.orgId===orgId){
    setActiveOrg(orgId);
    S.connOk=!!(url&&ORG_CFG[orgId].mode==="live");
    updateConn();
  }
  renderOrgSelect();closeModal();
  if(S.view==="settings")renderSettings();
}

function deleteOrg(){
  var orgId=_editingOrgId;if(!orgId)return;
  var o=null;for(var i=0;i<S.orgs.length;i++){if(S.orgs[i].orgId===orgId){o=S.orgs[i];break;}}
  if(!o)return;
  if(!confirm("Remove "+o.orgName+" from this app? (This does NOT delete the Google Sheet.)"))return;

  // Remove from ORG_CFG and S.orgs
  delete ORG_CFG[orgId];
  saveOrgCfg(ORG_CFG);
  S.orgs=S.orgs.filter(function(x){return x.orgId!==orgId;});

  // If deleted org was selected, switch to another
  if(S.selectedOrg&&S.selectedOrg.orgId===orgId){
    S.selectedOrg=S.orgs[0]||null;
    if(S.selectedOrg){
      setActiveOrg(S.selectedOrg.orgId);
      localStorage.setItem("hr_last_org",S.selectedOrg.orgId);
      S.connOk=!!(GAS_URL&&!USE_MOCK);
    } else {
      GAS_URL="";USE_MOCK=true;S.connOk=false;
    }
    updateConn();
  }

  // Clear last_org if deleted
  if(localStorage.getItem("hr_last_org")===orgId) localStorage.removeItem("hr_last_org");

  renderOrgSelect();closeModal();
  if(S.view==="settings")renderSettings();
  else renderContent();
}

async function onSalEmp(empId,reload){
  if(reload===undefined)reload=true;
  S.sf.empId=empId;
  var emp=findEmp(empId);
  var hint=document.getElementById("salHint"),card=document.getElementById("advDedCard");
  if(!emp){if(hint)hint.classList.add("hidden");if(card)card.classList.add("hidden");return;}
  if(hint){hint.classList.remove("hidden");hint.innerHTML='<strong>'+esc(emp.name)+'</strong><br>Gross: <strong>'+fmtk(gross(emp))+'/month</strong><span id="estEl"></span>';}
  if(card)card.classList.remove("hidden");
  updEst();
  // In live mode: fetch slip from GAS to populate cache before checking
  if(!USE_MOCK&&S.selectedOrg){
    var sf=S.sf;
    await fetchAndCacheSlip(S.selectedOrg.orgId,empId,sf.month,sf.year);
  }
  checkExistingSlip();
  if(reload)await loadAdvList(empId);
}

function updEst(){
  var sf=S.sf,emp=findEmp(sf.empId);
  var el=document.getElementById("estEl");if(!el)return;
  if(emp&&parseFloat(sf.leaveDays)>0){
    el.innerHTML='<br><span class="red">Est. leave deduction &asymp; '+fmtk(Math.round(gross(emp)/sf.workingDays*sf.leaveDays))+'</span>';
  }else{el.innerHTML="";}
  // When month/year changes in live mode, re-fetch slip for new period
  if(!USE_MOCK&&S.selectedOrg&&sf.empId){
    fetchAndCacheSlip(S.selectedOrg.orgId,sf.empId,sf.month,sf.year).then(function(){checkExistingSlip();});
  }else{
    checkExistingSlip();
  }
}

function checkExistingSlip(){
  var sf=S.sf;
  var ab=document.getElementById("alreadyBox");
  var ga_el=document.getElementById("genArea");
  if(!ab||!ga_el)return;
  if(!sf.empId){ab.innerHTML="";ga_el.innerHTML='<button class="btn btn-primary" style="width:100%" id="genBtn" onclick="generateSlip()">Generate Salary Slip</button>';return;}

  var existing=existingSlipSync(S.selectedOrg?S.selectedOrg.orgId:"",sf.empId,sf.month,sf.year);
  if(existing){
    ab.innerHTML=
      '<div class="already-box">'+
        '<div class="ab-title">✅ Salary slip already generated</div>'+
        '<div class="ab-sub">'+MONTHS[sf.month-1]+' '+sf.year+' &mdash; Net: <strong>'+fmt(existing.netSalary)+'</strong></div>'+
      '</div>';
    ga_el.innerHTML=
      '<div style="display:flex;gap:8px">'+
        '<button class="btn btn-secondary" style="flex:1" onclick="viewExistingSlip()">'+IC.eye+' View Slip</button>'+
        '<button class="btn btn-red btn-sm" onclick="deleteSlip(\''+existing.slipId+'\')">'+IC.trash+' Delete &amp; Regenerate</button>'+
      '</div>';
  }else{
    ab.innerHTML="";
    ga_el.innerHTML='<button class="btn btn-primary" style="width:100%" id="genBtn" onclick="generateSlip()">Generate Salary Slip</button>';
  }
}

async function viewExistingSlip(){
  var sf=S.sf;
  var existing=existingSlipSync(S.selectedOrg?S.selectedOrg.orgId:"",sf.empId,sf.month,sf.year);
  if(existing){S.lastSlip=existing;await loadPaymentForSlip(existing);renderSlip(existing);}
}

async function deleteSlip(slipId){
  if(!confirm("Delete this salary slip? You can then regenerate it."))return;
  await call("deleteSlip",{orgId:S.selectedOrg.orgId,slipId:slipId});
  S.lastSlip=null;

  if(!USE_MOCK){

async function generateSlip(){
  var sf=S.sf;
  if(!S.selectedOrg){alert("No organisation selected.");return;}
  if(!sf.empId){alert("Please select an employee.");return;}
  var btn=document.getElementById("genBtn");
  if(btn){btn.disabled=true;btn.textContent="Generating\u2026";}
  try{
    var lvRes=await call("recordLeave",{orgId:S.selectedOrg.orgId,empId:sf.empId,
      month:sf.month,year:sf.year,leaveDays:sf.leaveDays,leaveType:sf.leaveType});
    // Non-fatal: if leave record fails (e.g. sheet not yet created in GAS), continue
    if(lvRes&&lvRes.success===false){
      console.warn("recordLeave warning:",lvRes.error);
    }
    var res=await call("generateSalarySlip",{orgId:S.selectedOrg.orgId,empId:sf.empId,
      month:sf.month,year:sf.year,workingDays:sf.workingDays});
    if(!res||res.success===false) throw new Error(res?(res.error||"Failed"):"No response from server");
    var slip=res.slip;
    // Parse deductionDetails if GAS returned it as a JSON string
    if(typeof slip.deductionDetails==="string"){
      try{slip.deductionDetails=JSON.parse(slip.deductionDetails);}catch(e){slip.deductionDetails=[];}
    }
    if(!Array.isArray(slip.deductionDetails)) slip.deductionDetails=[];
    // Normalise all numeric fields
    ["basicSalary","hra","otherAllowances","grossSalary","leaveDays",
     "leaveDeduction","advanceDeduction","otherDeductions","totalDeductions","netSalary"].forEach(function(k){
      slip[k]=parseFloat(slip[k])||0;
    });
    slip.month=parseInt(slip.month); slip.year=parseInt(slip.year);
    slip.workingDays=parseInt(slip.workingDays)||26;
    S.lastSlip=slip;
    // Cache for live mode so checkExistingSlip works without extra round-trip
    if(!USE_MOCK&&S.selectedOrg){
      var ckey=S.selectedOrg.orgId+"_"+sf.empId+"_"+sf.month+"_"+sf.year;
      LIVE_SLIPS_CACHE[ckey]=slip;
    }
    // Load payment status for this slip before rendering
    await loadPaymentForSlip(slip);
    renderSlip(slip); checkExistingSlip(); await loadAdvList(sf.empId);
  }catch(err){
    alert("Error generating salary slip: "+err.message);
    console.error("generateSlip error:",err);
  }
  if(btn){btn.disabled=false;btn.textContent="Generate Salary Slip";}
}

function buildPaySection(slip){
  // Register slip for safe onclick access
  SLIP_REGISTRY[slip.slipId]=slip;
  var sid=slip.slipId;
  var pay=PAY_CACHE[sid]||null;
  if(pay){
    var methodLabel=pay.method==="bank"?"Bank Transfer":"Cash";
    var methodIcon=pay.method==="bank"?"🏦":"💵";
    var dateStr=pay.paidAt?new Date(pay.paidAt).toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"}):"";
    return '<div class="pay-status '+(pay.method==="bank"?"paid-bank":"paid-cash")+'">'+
      '<span style="font-size:16px">'+methodIcon+'</span>'+
      '<div><strong>Paid via '+methodIcon+' '+methodLabel+'</strong><br><span style="font-size:11px;opacity:.7">'+dateStr+'</span></div>'+
      '<button class="btn btn-ghost btn-sm no-print" data-action="undo" data-sid="'+sid+'" style="margin-left:auto">Undo</button>'+
    '</div>';
  }
  return '<div class="pay-status unpaid">'+
    '<span style="font-size:15px">⏳</span>'+
    '<strong>Not yet paid</strong>&nbsp;<span style="font-weight:400;opacity:.7">— salary is in pending ledger</span>'+
  '</div>'+
  '<div class="pay-btns no-print">'+
    '<button class="btn btn-cash" data-action="pay" data-sid="'+sid+'" data-method="cash">💵 Mark Paid — Cash</button>'+
    '<button class="btn btn-bank" data-action="pay" data-sid="'+sid+'" data-method="bank">🏦 Mark Paid — Bank</button>'+
  '</div>';
}

// Additional delegated handler for adhoc-pay (needs empId from attribute, no slip)
// (adhoc-pay handled by unified listener)

async function loadPaymentForSlip(slip){
  var orgId=slip.orgId||(S.selectedOrg?S.selectedOrg.orgId:null);
  if(!orgId) return;
  // Also backfill slip.orgId so markPaid/undo can use it
  if(!slip.orgId) slip.orgId=orgId;
  var res=await call("getPayments",{orgId:orgId,slipId:slip.slipId});
  var pays=res.data||[];
  if(pays.length>0) PAY_CACHE[slip.slipId]=pays[0];
  else delete PAY_CACHE[slip.slipId];
}

async function markPaid(slipId,orgId,empId,amount,method){
  // Always ensure orgId is set — fall back to selected org if slip.orgId was undefined
  var resolvedOrgId=orgId||( S.selectedOrg?S.selectedOrg.orgId:null);
  if(!resolvedOrgId){alert("Cannot record payment: organisation not identified.");return;}
  var res=await call("recordPayment",{orgId:resolvedOrgId,empId:empId,slipId:slipId,
    amount:amount,method:method,paidAt:new Date().toISOString()});
  if(!res||res.success===false){alert("Failed to record payment: "+(res?res.error:"No response"));return;}
  var paidNow=new Date().toISOString();
  PAY_CACHE[slipId]={slipId:slipId,empId:empId,orgId:resolvedOrgId,amount:amount,method:method,paidAt:paidNow};
  refreshPaySection(slipId,S.lastSlip);
}

async function undoPayment(slipId,orgId,empId){
  var resolvedOrgId=orgId||(S.selectedOrg?S.selectedOrg.orgId:null);
  if(!resolvedOrgId){alert("Cannot undo payment: organisation not identified.");return;}
  if(!confirm("Undo this payment? The salary will return to pending ledger.")) return;
  await call("undoPayment",{orgId:resolvedOrgId,empId:empId,slipId:slipId});
  delete PAY_CACHE[slipId];
  refreshPaySection(slipId,S.lastSlip);
}

function refreshPaySection(slipId,slip){
  if(!slip) return;
  var el=document.getElementById("slipPaySection_"+slipId);
  if(el) el.innerHTML=buildPaySection(slip);
  // Also refresh in report modal if open
  var mel=document.getElementById("modalSlipPay_"+slipId);
  if(mel) mel.innerHTML=buildPaySection(slip);
}

        '<div class="fg"><label>Payment Method *</label>'+

function fillFullAmount(total){
  var inp=document.getElementById("adhoc_amt");
  if(inp){ inp.value=total.toFixed(2); previewFIFO(); }
}

function previewFIFO(){
  var inp=document.getElementById("adhoc_amt");
  var saveBtn=document.getElementById("adhocSaveBtn");
  if(!inp) return;
  var amt=parseFloat(inp.value)||0;
  var pending=window._adhocPending||[];

  // Run FIFO allocation
  var remaining=amt;
  var allocations=[];
  pending.forEach(function(p){
    var allocated=Math.min(remaining,p.outstanding);
    allocated=parseFloat(allocated.toFixed(2));
    allocations.push({slipId:p.slipId,month:p.month,year:p.year,
      outstanding:p.outstanding,allocated:allocated});
    remaining=parseFloat((remaining-allocated).toFixed(2));
  });
  window._adhocAllocations=allocations;

  // Update preview rows
  allocations.forEach(function(al){
    var rowEl=document.getElementById("ar_"+al.slipId);
    var allocEl=document.getElementById("alloc_"+al.slipId);
    var remainEl=document.getElementById("remain_"+al.slipId);
    if(!rowEl) return;
    rowEl.className="alloc-row "+(al.allocated>=al.outstanding?"fully-paid":al.allocated>0?"partly-paid":"unpaid");
    if(allocEl) allocEl.textContent=al.allocated>0?"+"+fmt(al.allocated):"—";
    var afterPay=parseFloat((al.outstanding-al.allocated).toFixed(2));
    if(remainEl) remainEl.textContent=al.allocated>=al.outstanding?"✅ Fully Settled":"Pending after: "+fmt(afterPay);
  });

  // Summary
  var sumEl=document.getElementById("fifoSummary");
  if(sumEl){
    if(amt<=0){
      sumEl.innerHTML="";
      if(saveBtn) saveBtn.disabled=true;
    } else {
      var totalAlloc=allocations.reduce(function(s,a){return s+a.allocated;},0);
      var totalPending=pending.reduce(function(s,p){return s+p.outstanding;},0);
      var afterAll=parseFloat((totalPending-totalAlloc).toFixed(2));
      var isPartial=afterAll>0;
      sumEl.innerHTML='<div class="fifo-summary'+(isPartial?" partial":"")+'">'+
        (isPartial
          ? "⚠️ Partial payment of "+fmt(totalAlloc)+" will be recorded. Remaining outstanding: "+fmt(afterAll)
          : "✅ Full payment of "+fmt(totalAlloc)+" — all outstanding months cleared")+
      '</div>';
      if(saveBtn) saveBtn.disabled=(amt<=0);
    }
  }
}

async function saveAdhocPayment(){
  var amt=parseFloat(gv("adhoc_amt"))||0;
  var method=gv("adhoc_method")||"cash";
  var note=gv("adhoc_note")||"";
  var orgId=window._adhocOrgId;
  var empId=window._adhocEmpId;
  var allocations=window._adhocAllocations||[];
  var validAllocs=allocations.filter(function(a){return a.allocated>0;});

  if(!amt||amt<=0){alert("Please enter a valid amount.");return;}
  if(!validAllocs.length){alert("No slips to allocate payment to.");return;}

  var btn=document.getElementById("adhocSaveBtn");
  if(btn){btn.disabled=true;btn.textContent="Saving…";}

  try{
    var res=await call("recordAdhocPayment",{
      orgId:orgId,empId:empId,amount:amt,method:method,
      note:note,paidAt:new Date().toISOString(),
      allocations:validAllocs.map(function(a){return {slipId:a.slipId,amount:a.allocated};})
    });
    if(!res||res.success===false) throw new Error(res?res.error:"Failed");

    // Update PAY_CACHE for each allocated slip so Salary tab shows updated status
    var payNow=new Date().toISOString();
    validAllocs.forEach(function(a){
      PAY_CACHE[a.slipId]={
        slipId:a.slipId,empId:empId,orgId:orgId,
        amount:a.allocated,method:method,paidAt:payNow
      };
    });
    // Also update LIVE_SLIPS_CACHE entries to avoid stale "unpaid" status
    Object.keys(LIVE_SLIPS_CACHE).forEach(function(k){
      var s=LIVE_SLIPS_CACHE[k];
      if(s&&s.empId===empId){
        // Force re-fetch next time this slip is viewed
        delete LIVE_SLIPS_CACHE[k];
      }
    });

    closeModal();
    // Reload ledger to reflect new payments
    await loadLedger();
  }catch(err){
    alert("Error saving payment: "+err.message);
    if(btn){btn.disabled=false;btn.textContent="Save Payment";}
  }
}

async function loadReport(){
  var rpt=S.rpt,m=parseInt(rpt.month),y=parseInt(rpt.year);
  var ms=document.getElementById("rpt_m"),ys=document.getElementById("rpt_y");
  if(ms)ms.value=m;if(ys)ys.value=y;
  var rs=document.getElementById("rSum"),rt=document.getElementById("rTable");
  if(rs)rs.innerHTML="";
  if(rt)rt.innerHTML='<div class="empty"><p>Loading&hellip;</p></div>';

  // fetch slips and employees in parallel
  var res=await Promise.all([
    call("getSalarySlips",{orgId:S.selectedOrg.orgId,month:m,year:y}),
    call("getEmployees",{org:S.selectedOrg.orgId})
  ]);
  var rawSlips=res[0].data||[];
  S.employees=res[1].data||[];
  // Normalise slips from GAS (numbers may come as strings, deductionDetails as JSON string)
  var slips=rawSlips.map(function(s){
    if(typeof s.deductionDetails==="string"){
      try{s.deductionDetails=JSON.parse(s.deductionDetails);}catch(e){s.deductionDetails=[];}
    }
    if(!Array.isArray(s.deductionDetails)) s.deductionDetails=[];
    ["basicSalary","hra","otherAllowances","grossSalary","leaveDays",
     "leaveDeduction","advanceDeduction","otherDeductions","totalDeductions","netSalary"].forEach(function(k){
      s[k]=parseFloat(s[k])||0;
    });
    s.month=parseInt(s.month); s.year=parseInt(s.year);
    s.workingDays=parseInt(s.workingDays)||26;
    return s;
  });
  S.reportSlips=slips;
  // Pre-fetch payments for all slips to show status in table
  await Promise.all(slips.map(function(s){ return loadPaymentForSlip(s); }));

  if(!slips.length){
    if(rs)rs.innerHTML="";
    if(rt)rt.innerHTML='<div class="empty"><p>No salary slips generated for <strong>'+MONTHS[m-1]+' '+y+'</strong>.<br>Generate slips from Salary &amp; Slips tab first.</p></div>';
    return;
  }

  var tG=0,tD=0,tN=0;
  for(var i=0;i<slips.length;i++){tG+=slips[i].grossSalary;tD+=slips[i].totalDeductions;tN+=slips[i].netSalary;}

  if(rs)rs.innerHTML=
    '<div class="rsum-card"><div class="rsum-label">Employees Processed</div><div class="rsum-val">'+slips.length+'</div></div>'+
    '<div class="rsum-card"><div class="rsum-label">Total Gross</div><div class="rsum-val">'+fmtk(tG)+'</div></div>'+

// ── SETTINGS ─────────────────────────────────────────────────
function renderSettings(){
  var el=document.getElementById("mainContent");
  var orgId=S.selectedOrg?S.selectedOrg.orgId:null;
  var orgCfg=orgId?(ORG_CFG[orgId]||{}):{};
  var isLive=(orgCfg.mode==="live"),hasUrl=!!orgCfg.url;
  var connHtml="";
  if(isLive&&S.connOk)connHtml='<div class="sbox ok">Connected to Google Sheets.</div>';
  else if(isLive&&hasUrl)connHtml='<div class="sbox err">Connection failed. Verify URL and deployment settings.</div>';

  // Org management list
  var orgListHtml=S.orgs.map(function(o){
    var cfg=ORG_CFG[o.orgId]||{};
    var lbl=cfg.mode==="live"?"Live":"Demo";
    var isActive=orgId===o.orgId;
    return '<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid #f5f5f5'+(isActive?";background:#f0f6ff":"")+'">'+
      '<div><div class="bold" style="font-size:13px">'+esc(o.orgName)+'</div>'+
      '<div class="muted">'+lbl+(cfg.url?' &bull; '+esc(cfg.url.slice(0,42))+'...':'') +'</div></div>'+
      '<button class="btn btn-ghost btn-sm" data-action="edit-org" data-orgid="'+o.orgId+'">'+IC.edit+'</button>'+
    '</div>';
  }).join("") || '<div class="empty" style="padding:20px"><p>No organisations yet.</p></div>';

  el.innerHTML=
    '<div class="card" style="margin-bottom:16px">'+
      '<div class="card-header"><h3>Organisations</h3><button class="btn btn-primary btn-sm" onclick="openOrgModal()">'+IC.plus+' Add Org</button></div>'+
      orgListHtml+
    '</div>'+
    (orgId?
    '<div class="card">'+
      '<div class="settings-section">'+
        '<h3>Connection — '+esc(S.selectedOrg.orgName)+'</h3>'+
        '<p>Switch between Demo Mode and Google Sheets for this organisation.</p>'+
        '<div class="mode-toggle">'+
          '<div class="mode-opt '+(USE_MOCK?"sel":"")+'" id="optDemo"><div class="mo-icon">⚡</div><div class="mo-title">Demo Mode</div><div class="mo-sub">Local only</div></div>'+
          '<div class="mode-opt '+(!USE_MOCK?"sel":"")+'" id="optLive"><div class="mo-icon">🔗</div><div class="mo-title">Google Sheets</div><div class="mo-sub">Live data</div></div>'+
        '</div>'+
      '</div>'+
      '<div class="settings-section" id="gasSection" style="'+(USE_MOCK?"opacity:.5;pointer-events:none":"")+'">'+
        '<h3>Apps Script URL — '+esc(S.selectedOrg.orgName)+'</h3>'+
        '<p>Each organisation links to its own Google Sheet deployment.</p>'+
        '<div class="url-row">'+
          '<input type="url" id="gasInput" class="mono" style="font-size:12px" placeholder="https://script.google.com/macros/s/.../exec" value="'+esc(orgCfg.url||"")+'"/>'+
          '<button class="btn btn-primary" onclick="testConn()">Test &amp; Save</button>'+
        '</div>'+
        '<div id="connResult">'+connHtml+'</div>'+
        (hasUrl&&isLive?'<button class="btn btn-secondary btn-sm" style="margin-top:8px" onclick="disconn()">Disconnect</button>':'')+
      '</div>'+
      '<div class="settings-section">'+
        '<h3>Setup Guide</h3>'+
        '<p>Each organisation needs its own Google Sheet:</p>'+
        '<ol class="step-list">'+
          '<li>Create a new Google Sheet, open <strong>Extensions &rarr; Apps Script</strong>.</li>'+
          '<li>Paste the full <code>HR_AppScript.gs</code> content and run <code>setupMasterSheets</code>.</li>'+
          '<li><strong>Deploy &rarr; New Deployment</strong> &rarr; Web App. Execute as: Me. Access: Anyone.</li>'+
          '<li>Copy the URL, paste above, click <strong>Test &amp; Save</strong>.</li>'+
        '</ol>'+
      '</div>'+
    '</div>'
    :'<div class="sbox info">Select an organisation to configure its connection.</div>'
    );

  var optDemo=document.getElementById("optDemo");
  var optLive=document.getElementById("optLive");
  if(optDemo)optDemo.addEventListener("click",function(){selectMode("demo");});
  if(optLive)optLive.addEventListener("click",function(){selectMode("live");});
}

function selectMode(mode){
  var orgId=S.selectedOrg?S.selectedOrg.orgId:null;
  if(!orgId)return;
  USE_MOCK=(mode!=="live");
  var cfg=ORG_CFG[orgId]||{};
  cfg.mode=mode;if(mode==="demo")cfg.url="";
  ORG_CFG[orgId]=cfg;saveOrgCfg(ORG_CFG);
  // Also keep _cfg in sync
  _cfg.mode=mode;localStorage.setItem("hr_cfg",JSON.stringify(_cfg));
  var od=document.getElementById("optDemo"),ol=document.getElementById("optLive");
  var gs=document.getElementById("gasSection");
  if(od)od.className="mode-opt "+(USE_MOCK?"sel":"");
  if(ol)ol.className="mode-opt "+(!USE_MOCK?"sel":"");
  if(gs)gs.style.cssText=USE_MOCK?"opacity:.5;pointer-events:none":"";
  updateConn();
}

async function testConn(){
  var url=(document.getElementById("gasInput")||{}).value||"";
  url=url.trim();
  var orgId=S.selectedOrg?S.selectedOrg.orgId:null;
  if(!orgId){showCR("err","No organisation selected.");return;}
  if(!url){showCR("err","Please enter the Apps Script URL.");return;}
  if(!url.startsWith("https://script.google.com")){showCR("err","URL must start with https://script.google.com");return;}
  showCR("info","Testing connection...");
  try{
    var r=await fetch(url+"?action=getOrganisations");
    if(!r.ok)throw new Error("HTTP "+r.status);
    var data=await r.json();
    if(!data||data.success===false)throw new Error(data.error||"Bad response");
    // Fetch org list from this GAS to get authoritative org names
    GAS_URL=url;USE_MOCK=false;S.connOk=true;
    _cfg.url=url;_cfg.mode="live";localStorage.setItem("hr_cfg",JSON.stringify(_cfg));

    // Update ORG_CFG with GAS orgs (authoritative names + link each org to this URL)
    data.data.forEach(function(o){
      if(!ORG_CFG[o.orgId]) ORG_CFG[o.orgId]={};
      ORG_CFG[o.orgId].name=o.orgName;
      ORG_CFG[o.orgId].url=url;
      ORG_CFG[o.orgId].mode="live";
    });
    saveOrgCfg(ORG_CFG);

    // Merge new orgs into S.orgs, update existing names
    data.data.forEach(function(o){
      var found=false;
      for(var i=0;i<S.orgs.length;i++){
        if(S.orgs[i].orgId===o.orgId){S.orgs[i].orgName=o.orgName;found=true;break;}
      }
      if(!found) S.orgs.push({orgId:o.orgId,orgName:o.orgName});
    });

    // Update current selected org name if it came from this sheet
    if(S.selectedOrg){
      for(var i=0;i<S.orgs.length;i++){
        if(S.orgs[i].orgId===S.selectedOrg.orgId){
          S.selectedOrg.orgName=S.orgs[i].orgName;break;
        }
      }
    }

    // Deduplicate S.orgs after merging
    var tcSeen={};var tcOrgs=[];
    S.orgs.forEach(function(o){if(!tcSeen[o.orgId]){tcSeen[o.orgId]=true;tcOrgs.push(o);}});
    S.orgs=tcOrgs;

    updateConn();
    renderOrgSelect();
    showCR("ok","Connected! "+data.data.length+" organisation(s) loaded from Google Sheet.");
    var gs=document.getElementById("gasSection");if(gs)gs.style.cssText="";
    var od=document.getElementById("optDemo"),ol=document.getElementById("optLive");
    if(od)od.className="mode-opt";if(ol)ol.className="mode-opt sel";
  }catch(e){
    S.connOk=false;updateConn();
    showCR("err","Failed: "+e.message+". Ensure deployment is set to Anyone can access.");
  }
}

function showCR(type,msg){var el=document.getElementById("connResult");if(el)el.innerHTML='<div class="sbox '+type+'">'+msg+'</div>';}

function disconn(){
  var orgId=S.selectedOrg?S.selectedOrg.orgId:null;
  if(!confirm("Disconnect this organisation from Google Sheets?"))return;
  GAS_URL="";USE_MOCK=true;S.connOk=false;
  if(orgId){ORG_CFG[orgId]={name:S.selectedOrg.orgName,url:"",mode:"demo"};saveOrgCfg(ORG_CFG);}
  _cfg={};localStorage.removeItem("hr_cfg");
  updateConn();renderSettings();
}


// ── ROUTER ────────────────────────────────────────────────────
async function renderContent(){
  var el=document.getElementById("mainContent");
  if(el)el.innerHTML='<div class="empty"><p>Loading&hellip;</p></div>';
  if(S.view==="dashboard") await renderDashboard();
  else if(S.view==="employees") await renderEmployees();
  else if(S.view==="salary") await renderSalary();
  else if(S.view==="advances") await renderAdvances();
  else if(S.view==="reports") await renderReports();
  else if(S.view==="ledger") await renderLedger();
  else if(S.view==="settings") renderSettings();
}

// ── INIT ──────────────────────────────────────────────────────
async function init(){
  // Wire mobile pill
  var pill=document.getElementById("mobOrgPill");
  if(pill)pill.addEventListener("click",openOrgSheet);
  var shBg=document.getElementById("orgSheetBg");
  if(shBg)shBg.addEventListener("click",closeOrgSheet);
  var shAdd=document.getElementById("orgSheetAdd");
  if(shAdd)shAdd.addEventListener("click",function(){closeOrgSheet();openOrgModal();});

  // ── Build org list by fetching from EACH org's own GAS URL ──
  // Each org in ORG_CFG has its own Google Sheet. Fetch names from GAS
  // (authoritative) rather than trusting locally-stored names.
  var cfgKeys=Object.keys(ORG_CFG);
  var allOrgs=[];

  if(cfgKeys.length){
    // Fetch org list from every configured GAS URL in parallel
    var fetchResults=await Promise.all(cfgKeys.map(async function(oid){
      var cfg=ORG_CFG[oid]||{};
      if(!cfg.url||cfg.mode!=="live") return [];
      try{
        var r2=await fetch(cfg.url+"?action=getOrganisations");
        if(!r2.ok) return [];
        var data=await r2.json();
        if(!data||!data.data) return [];
        // Tag each org with its GAS URL so we know which sheet it belongs to
        return data.data.map(function(o){
          // Update ORG_CFG with authoritative org name from GAS
          if(!ORG_CFG[o.orgId]) ORG_CFG[o.orgId]={};
          ORG_CFG[o.orgId].name=o.orgName;
          ORG_CFG[o.orgId].url=cfg.url;
          ORG_CFG[o.orgId].mode="live";
          return {orgId:o.orgId,orgName:o.orgName};
        });
      }catch(e){ return []; }
    }));
    saveOrgCfg(ORG_CFG);

    // Deduplicate orgs across all sheets
    var seen={};
    fetchResults.forEach(function(list){
      list.forEach(function(o){if(!seen[o.orgId]){seen[o.orgId]=true;allOrgs.push(o);}});
    });

    // Include ORG_CFG entries that had fetch errors (offline fallback)
    // but ONLY if we didn't already get them from GAS
    cfgKeys.forEach(function(oid){
      if(!seen[oid]&&ORG_CFG[oid]&&ORG_CFG[oid].name&&ORG_CFG[oid].url){
        seen[oid]=true;
        allOrgs.push({orgId:oid,orgName:ORG_CFG[oid].name});
      }
    });
  }

  // Final deduplication by orgId (in case any slipped through)
  var finalSeen={};
  var finalOrgs=[];
  allOrgs.forEach(function(o){
    if(!finalSeen[o.orgId]){finalSeen[o.orgId]=true;finalOrgs.push(o);}
  });

  S.orgs=finalOrgs;

  // Restore last selected org
  var lastOrgId=localStorage.getItem("hr_last_org");
  S.selectedOrg=null;
  if(lastOrgId){
    for(var i=0;i<S.orgs.length;i++){
      if(S.orgs[i].orgId===lastOrgId){S.selectedOrg=S.orgs[i];break;}
    }
  }
  if(!S.selectedOrg&&S.orgs.length) S.selectedOrg=S.orgs[0];

  if(S.selectedOrg){
    setActiveOrg(S.selectedOrg.orgId);
    S.connOk=!USE_MOCK&&!!GAS_URL;
  }
  updateConn();
  renderOrgSelect();renderNav();
  await renderContent();
}

// ── UNIFIED CLICK DELEGATION ─────────────────────────────────
document.addEventListener("click",function(e){
  var target=e.target;
  if(!target||!target.closest) return;
  // Mobile nav (data-view)
  var navEl=target.closest("[data-view]");
  if(navEl){var v=navEl.getAttribute("data-view");if(v)setView(v);return;}
  // All data-action buttons
  var btn=target.closest("[data-action]");
  if(!btn) return;
  var action=btn.getAttribute("data-action");
  if(action==="ledger-details"){
    var empId=btn.getAttribute("data-empid"),empName=btn.getAttribute("data-empname");
    if(empId)openEmpLedger(empId,empName||empId);
  }else if(action==="adhoc-pay"){
    var empId=btn.getAttribute("data-empid"),empName=btn.getAttribute("data-empname");
    if(empId)openAdhocPayModal(empId,empName||empId);
  }else if(action==="edit-org"){
    var oid=btn.getAttribute("data-orgid");if(oid)openEditOrgModal(oid);
  }else if(action==="mob-switch-org"){
    var sid=btn.getAttribute("data-orgid");
    if(sid){onOrgChange(sid);var sel=document.getElementById("orgSelect");if(sel)sel.value=sid;closeOrgSheet();}
  }else if(action==="pay"){
    var sid=btn.getAttribute("data-sid");
    var slip=SLIP_REGISTRY[sid]||(S.lastSlip&&S.lastSlip.slipId===sid?S.lastSlip:null);
    if(!slip)return;
    markPaid(sid,slip.orgId,slip.empId,slip.netSalary,btn.getAttribute("data-method"));
  }else if(action==="undo"){
    var sid=btn.getAttribute("data-sid");
    var slip=SLIP_REGISTRY[sid]||(S.lastSlip&&S.lastSlip.slipId===sid?S.lastSlip:null);
    if(!slip)return;
    undoPayment(sid,slip.orgId,slip.empId);
  }
});

init();
