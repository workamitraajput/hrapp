<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>HR Management System</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:#f7f6f3;color:#333;}
.app{display:flex;min-height:100vh;}

.sidebar{width:240px;min-height:100vh;background:#1a1a2e;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;flex-shrink:0;}
.sidebar-brand{padding:24px 20px 16px;border-bottom:1px solid rgba(255,255,255,.08);}
.sidebar-brand h1{font-size:15px;font-weight:600;color:#fff;letter-spacing:.02em;}
.sidebar-brand p{font-size:11px;color:rgba(255,255,255,.4);margin-top:2px;}
.org-selector{padding:12px 20px;border-bottom:1px solid rgba(255,255,255,.08);}
.org-selector label{font-size:10px;color:rgba(255,255,255,.4);letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:6px;}
.org-selector select{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#fff;font-family:'DM Sans',sans-serif;font-size:13px;padding:7px 10px;border-radius:6px;cursor:pointer;}
.sidebar-nav{padding:8px 0;flex:1;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;color:rgba(255,255,255,.55);font-size:13px;cursor:pointer;transition:all .15s;border-left:2px solid transparent;user-select:none;}
.nav-item:hover{color:#fff;background:rgba(255,255,255,.06);}
.nav-item.active{color:#7c9eff;background:rgba(124,158,255,.1);border-left-color:#7c9eff;}

/* Connection panel */
.conn-panel{padding:12px 16px;border-top:1px solid rgba(255,255,255,.08);}
.conn-status{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.conn-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;transition:background .3s;}
.conn-dot.demo{background:#f59e0b;}
.conn-dot.live{background:#22c55e;box-shadow:0 0 6px rgba(34,197,94,.5);}
.conn-dot.error{background:#ef4444;}
.conn-dot.testing{background:#7c9eff;animation:blink .8s ease-in-out infinite alternate;}
@keyframes blink{from{opacity:.3;}to{opacity:1;}}
.conn-info strong{display:block;font-size:11px;font-weight:600;color:#fff;}
.conn-info span{font-size:10px;color:rgba(255,255,255,.45);}
.conn-btn{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.75);font-family:'DM Sans',sans-serif;font-size:12px;padding:7px 10px;border-radius:6px;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:6px;}
.conn-btn:hover{background:rgba(255,255,255,.15);color:#fff;}

/* Main */
.main{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{background:#fff;border-bottom:1px solid #eee;padding:16px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;}
.topbar h2{font-size:18px;font-weight:600;color:#1a1a2e;}
.content{padding:24px 28px;}

/* Cards */
.card{background:#fff;border-radius:10px;border:1px solid #eee;overflow:hidden;margin-bottom:16px;}
.card-header{padding:14px 20px;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.card-header h3{font-size:14px;font-weight:600;color:#333;}

/* Table */
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{padding:9px 16px;text-align:left;font-size:11px;font-weight:500;color:#888;letter-spacing:.06em;text-transform:uppercase;background:#fafafa;border-bottom:1px solid #f0f0f0;white-space:nowrap;}
tbody tr{border-bottom:1px solid #f8f8f8;transition:background .1s;}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:#fafbff;}
tbody td{padding:11px 16px;color:#444;vertical-align:middle;}
tfoot td{padding:11px 16px;font-weight:600;background:#f7f6f3;border-top:2px solid #eee;}
.tr{text-align:right;}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 14px;border-radius:7px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;border:none;}
.btn:disabled{opacity:.6;cursor:not-allowed;}
.btn-primary{background:#1a1a2e;color:#fff;}
.btn-primary:hover:not(:disabled){background:#252545;}
.btn-secondary{background:#f3f4f6;color:#333;}
.btn-secondary:hover{background:#e8e9ec;}
.btn-ghost{background:transparent;color:#666;padding:6px 8px;}
.btn-ghost:hover{background:#f3f4f6;color:#333;}
.btn-blue{background:#eff6ff;color:#1d4ed8;}
.btn-blue:hover{background:#dbeafe;}
.btn-red{background:#fee2e2;color:#991b1b;}
.btn-red:hover{background:#fecaca;}
.btn-sm{padding:5px 10px;font-size:12px;}

/* Badges */
.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:500;}
.bg{background:#dcfce7;color:#166534;}
.br{background:#fee2e2;color:#991b1b;}
.by{background:#fef9c3;color:#854d0e;}
.bb{background:#dbeafe;color:#1d4ed8;}
.bgy{background:#f3f4f6;color:#4b5563;}
.bp{background:#ede9fe;color:#6d28d9;}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:#fff;border-radius:12px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2);}
.modal-wide{max-width:680px;}
.modal-hdr{padding:18px 22px 14px;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:1;}
.modal-hdr h3{font-size:15px;font-weight:600;color:#1a1a2e;}
.modal-body{padding:18px 22px;}
.modal-foot{padding:12px 22px;border-top:1px solid #f0f0f0;display:flex;justify-content:flex-end;gap:8px;}

/* Forms */
.form-row{display:grid;gap:12px;margin-bottom:12px;}
.c2{grid-template-columns:1fr 1fr;}
.c3{grid-template-columns:1fr 1fr 1fr;}
.fg{display:flex;flex-direction:column;gap:4px;}
.fg label{font-size:12px;font-weight:500;color:#555;}
.fg input,.fg select,.fg textarea{padding:8px 11px;border:1px solid #e0e0e0;border-radius:7px;font-family:'DM Sans',sans-serif;font-size:13px;color:#333;background:#fff;outline:none;transition:border-color .15s;width:100%;}
.fg input:focus,.fg select:focus{border-color:#7c9eff;}

/* Stats */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
.stat-card{background:#fff;border:1px solid #eee;border-radius:10px;padding:16px 18px;}
.stat-label{font-size:11px;color:#888;margin-bottom:5px;font-weight:500;}
.stat-value{font-size:22px;font-weight:600;color:#1a1a2e;}
.stat-sub{font-size:11px;color:#aaa;margin-top:2px;}

/* Salary Slip */
.slip{background:#fff;border:1px solid #e0e0e0;border-radius:10px;overflow:hidden;}
.slip-hdr{background:linear-gradient(135deg,#1a1a2e,#16213e);padding:22px;color:#fff;}
.slip-hdr h2{font-size:19px;font-weight:600;margin-bottom:3px;}
.slip-hdr p{font-size:12px;opacity:.6;}
.slip-meta{display:grid;grid-template-columns:1fr 1fr;gap:5px 20px;font-size:12px;margin-top:14px;}
.slip-body{padding:20px 22px;}
.slip-section{margin-bottom:18px;}
.slip-section h4{font-size:11px;font-weight:600;color:#888;letter-spacing:.07em;text-transform:uppercase;margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid #eee;}
.slip-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed #f0f0f0;font-size:13px;}
.slip-row:last-child{border:none;}
.slip-row .lbl{color:#888;}
.slip-row .val{font-weight:500;}
.ded-item{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;background:#fef2f2;border-radius:6px;margin-bottom:5px;}
.ded-type{font-size:12px;font-weight:500;color:#444;}
.ded-desc{font-size:11px;color:#888;margin-top:1px;}
.ded-amt{font-size:13px;font-weight:600;color:#dc2626;font-family:'DM Mono',monospace;white-space:nowrap;padding-left:12px;}
.slip-total{background:#f7f6f3;border-radius:8px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;margin-top:10px;}
.slip-total .lbl{font-size:14px;font-weight:600;color:#333;}
.slip-total .amt{font-size:22px;font-weight:700;color:#1a1a2e;font-family:'DM Mono',monospace;}

/* Report */
.report-filter{display:flex;align-items:center;gap:12px;padding:14px 20px;background:#fafafa;border-bottom:1px solid #f0f0f0;flex-wrap:wrap;}
.report-filter label{font-size:12px;font-weight:500;color:#555;}
.report-filter select{padding:6px 10px;border:1px solid #e0e0e0;border-radius:6px;font-family:'DM Sans',sans-serif;font-size:13px;color:#333;background:#fff;outline:none;}
.rsum{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:16px 20px;border-bottom:1px solid #f0f0f0;background:#fafbff;}
.rsum-card{background:#fff;border:1px solid #eee;border-radius:8px;padding:12px 14px;}
.rsum-label{font-size:11px;color:#888;margin-bottom:3px;}
.rsum-val{font-size:16px;font-weight:600;color:#1a1a2e;}

/* Settings */
.settings-section{padding:22px 24px;border-bottom:1px solid #f5f5f5;}
.settings-section:last-child{border-bottom:none;}
.settings-section h3{font-size:14px;font-weight:600;color:#1a1a2e;margin-bottom:4px;}
.settings-section p{font-size:13px;color:#888;margin-bottom:14px;line-height:1.6;}
.mode-toggle{display:flex;gap:10px;}
.mode-opt{flex:1;padding:14px 10px;border:2px solid #eee;border-radius:9px;cursor:pointer;text-align:center;transition:all .15s;user-select:none;}
.mode-opt:hover{border-color:#c7d2fe;}
.mode-opt.sel{border-color:#7c9eff;background:#eff6ff;}
.mode-opt .mo-icon{font-size:22px;margin-bottom:5px;}
.mode-opt .mo-title{font-size:13px;font-weight:600;color:#333;}
.mode-opt .mo-sub{font-size:11px;color:#888;margin-top:2px;}
.url-row{display:flex;gap:8px;}
.url-row input{flex:1;padding:9px 12px;border:1px solid #e0e0e0;border-radius:7px;font-family:'DM Mono',monospace;font-size:12px;color:#333;outline:none;transition:border-color .15s;}
.url-row input:focus{border-color:#7c9eff;}
.sbox{border-radius:8px;padding:12px 14px;font-size:13px;margin-top:12px;line-height:1.5;}
.sbox.info{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;}
.sbox.ok{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;}
.sbox.err{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;}
.sbox.warn{background:#fffbeb;border:1px solid #fde68a;color:#92400e;}
.step-list{list-style:none;padding:0;counter-reset:step;}
.step-list li{counter-increment:step;display:flex;gap:12px;margin-bottom:11px;font-size:13px;color:#555;line-height:1.55;}
.step-list li::before{content:counter(step);background:#1a1a2e;color:#fff;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;margin-top:1px;}
.step-list code{background:#f3f4f6;padding:1px 6px;border-radius:4px;font-family:'DM Mono',monospace;font-size:12px;color:#1a1a2e;}

/* Utils */
.flex{display:flex;align-items:center;}
.gap8{gap:8px;}
.mono{font-family:'DM Mono',monospace;}
.muted{color:#888;font-size:12px;}
.bold{font-weight:600;}
.red{color:#dc2626;}
.green{color:#16a34a;}
.avt{width:32px;height:32px;border-radius:50%;background:#ede9fe;color:#6d28d9;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.hint{background:#f7f6f3;border-radius:7px;padding:9px 13px;font-size:13px;color:#555;margin-bottom:12px;}
.empty{padding:40px;text-align:center;color:#ccc;}
.empty p{font-size:14px;margin-top:8px;}
.hidden{display:none!important;}
.adv-card{background:#fff7ed;border-radius:7px;padding:8px 10px;margin-bottom:6px;font-size:12px;}
.adv-card .an{font-weight:500;margin-bottom:2px;}
.adv-card .am{color:#666;}
.two-col{display:grid;grid-template-columns:310px 1fr;gap:18px;align-items:start;}
.already-box{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:14px 16px;margin-bottom:12px;}
.already-box .ab-title{font-size:13px;font-weight:600;color:#166534;margin-bottom:2px;}
.already-box .ab-sub{font-size:12px;color:#4ade80;color:#166534;opacity:.8;}

@media print{
  .sidebar,.topbar,.no-print{display:none!important;}
  .main{width:100%;}
  .content{padding:0;}
  .slip{border:none;}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <h1>HR Manager</h1>
      <p>Multi-org payroll system</p>
    </div>
    <div class="org-selector">
      <label>Organisation</label>
      <select id="orgSelect"></select>
      <button class="btn btn-secondary btn-sm" style="width:100%;margin-top:8px" onclick="openOrgModal()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New Organisation
      </button>
    </div>
    <nav class="sidebar-nav" id="sideNav"></nav>
    <div class="conn-panel">
      <div class="conn-status">
        <div class="conn-dot demo" id="connDot"></div>
        <div class="conn-info">
          <strong id="connTitle">Demo Mode</strong>
          <span id="connSub">Local data only</span>
        </div>
      </div>
      <button class="conn-btn" id="connSettingsBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        Connection Settings
      </button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <h2 id="pageTitle">Dashboard</h2>
      <div class="flex gap8 no-print">
        <span class="badge bp" id="orgBadge"></span>
      </div>
    </div>
    <div class="content" id="mainContent">
      <div class="empty"><p>Loading...</p></div>
    </div>
  </div>
</div>

<div class="overlay hidden" id="modalOverlay">
  <div class="modal" id="modalBox">
    <div class="modal-hdr">
      <h3 id="modalTitle"></h3>
      <button class="btn btn-ghost" id="modalCloseBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<script>
// ── CONFIG (persisted in localStorage) ───────────────────────
var _cfg = (function(){ try{ return JSON.parse(localStorage.getItem("hr_cfg")||"{}"); }catch(e){ return {}; } })();
var GAS_URL  = _cfg.url  || "";
var USE_MOCK = (_cfg.mode !== "live");   // default: demo

var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
var CY = new Date().getFullYear();
var CM = new Date().getMonth() + 1;

// ── MOCK STORE ────────────────────────────────────────────────
var STORE = {
  orgs:[
    {orgId:"ORG_1",orgName:"Acme Corp"},
    {orgId:"ORG_2",orgName:"Globex Ltd"}
  ],
  employees:{
    "ORG_1":[
      {empId:"EMP_1",name:"Rajesh Kumar",designation:"Senior Developer",department:"Engineering",basicSalary:45000,hra:9000,otherAllowances:3000,joiningDate:"2022-06-01",contactNumber:"9876543210",email:"rajesh@acme.com",status:"Active"},
      {empId:"EMP_2",name:"Priya Sharma",designation:"HR Manager",department:"Human Resources",basicSalary:38000,hra:7600,otherAllowances:2500,joiningDate:"2021-03-15",contactNumber:"9876543211",email:"priya@acme.com",status:"Active"},
      {empId:"EMP_3",name:"Amit Patel",designation:"Accountant",department:"Finance",basicSalary:30000,hra:6000,otherAllowances:2000,joiningDate:"2023-01-10",contactNumber:"9876543212",email:"amit@acme.com",status:"Active"}
    ],
    "ORG_2":[
      {empId:"EMP_4",name:"Sunita Verma",designation:"Marketing Head",department:"Marketing",basicSalary:52000,hra:10400,otherAllowances:4000,joiningDate:"2020-08-01",contactNumber:"9876543213",email:"sunita@globex.com",status:"Active"}
    ]
  },
  advances:{},
  deductions:{},
  leaves:{},
  slips:{},
  _n:100
};
function nid(){ return "X"+(++STORE._n); }
function ga(obj,k){ if(!obj[k]) obj[k]=[]; return obj[k]; }

// ── MOCK API ──────────────────────────────────────────────────
async function mockApi(ac,d){
  d=d||{};
  await new Promise(function(r){setTimeout(r,120);});

  if(ac==="getOrganisations") return {success:true,data:STORE.orgs.slice()};
  if(ac==="addOrganisation"){
    var o={orgId:nid(),orgName:d.orgName};
    STORE.orgs.push(o);
    return {success:true,orgId:o.orgId};
  }

  if(ac==="getEmployees"){
    return {success:true,data:(ga(STORE.employees,d.org)).filter(function(e){return e.status!=="Inactive";})};
  }
  if(ac==="addEmployee"){
    var e={empId:nid(),name:d.name,designation:d.designation||"",department:d.department||"",
      basicSalary:parseFloat(d.basicSalary)||0,hra:parseFloat(d.hra)||0,otherAllowances:parseFloat(d.otherAllowances)||0,
      joiningDate:d.joiningDate||"",contactNumber:d.contactNumber||"",email:d.email||"",status:"Active"};
    ga(STORE.employees,d.orgId).push(e);
    return {success:true,empId:e.empId};
  }
  if(ac==="updateEmployee"){
    var L=ga(STORE.employees,d.orgId);
    for(var i=0;i<L.length;i++){
      if(L[i].empId===d.empId){
        L[i].name=d.name;L[i].designation=d.designation||"";L[i].department=d.department||"";
        L[i].basicSalary=parseFloat(d.basicSalary)||0;L[i].hra=parseFloat(d.hra)||0;
        L[i].otherAllowances=parseFloat(d.otherAllowances)||0;
        L[i].joiningDate=d.joiningDate||"";L[i].contactNumber=d.contactNumber||"";L[i].email=d.email||"";
        break;
      }
    }
    return {success:true};
  }
  if(ac==="deleteEmployee"){
    var L=ga(STORE.employees,d.orgId);
    for(var i=0;i<L.length;i++){if(L[i].empId===d.empId){L[i].status="Inactive";break;}}
    return {success:true};
  }

  if(ac==="recordLeave"){
    var L=ga(STORE.leaves,d.orgId),found=false;
    for(var i=0;i<L.length;i++){
      if(L[i].empId===d.empId&&L[i].month==d.month&&L[i].year==d.year){
        L[i].leaveDays=d.leaveDays;L[i].leaveType=d.leaveType;found=true;break;
      }
    }
    if(!found) L.push({orgId:d.orgId,empId:d.empId,month:parseInt(d.month),year:parseInt(d.year),leaveDays:parseFloat(d.leaveDays)||0,leaveType:d.leaveType||""});
    return {success:true};
  }

  if(ac==="getAdvances"){
    var L=ga(STORE.advances,d.orgId);
    return {success:true,data:d.empId?L.filter(function(a){return a.empId===d.empId;}):L.slice()};
  }
  if(ac==="addAdvance"){
    ga(STORE.advances,d.orgId).push({advanceId:nid(),orgId:d.orgId,empId:d.empId,
      date:new Date().toISOString(),amount:parseFloat(d.amount)||0,description:d.description,
      totalDeducted:0,status:"Active",monthlyDeduction:parseFloat(d.monthlyDeduction)||0,
      deductionType:d.deductionType||"scheduled"});
    return {success:true};
  }

  if(ac==="getDeductions"){
    var L=ga(STORE.deductions,d.orgId);
    return {success:true,data:d.empId?L.filter(function(x){return x.empId===d.empId;}):L.slice()};
  }
  if(ac==="addDeduction"){
    ga(STORE.deductions,d.orgId).push({dedId:nid(),orgId:d.orgId,empId:d.empId,
      month:parseInt(d.month),year:parseInt(d.year),amount:parseFloat(d.amount)||0,
      description:d.description,type:d.type||"adhoc"});
    return {success:true};
  }

  if(ac==="deleteSlip"){
    var L=ga(STORE.slips,d.orgId);
    STORE.slips[d.orgId]=L.filter(function(s){return s.slipId!==d.slipId;});
    return {success:true};
  }

  if(ac==="getSalarySlips"){
    var L=ga(STORE.slips,d.orgId).slice();
    if(d.empId) L=L.filter(function(s){return s.empId===d.empId;});
    if(d.month) L=L.filter(function(s){return s.month==d.month;});
    if(d.year)  L=L.filter(function(s){return s.year==d.year;});
    return {success:true,data:L};
  }

  if(ac==="generateSalarySlip"){
    var orgId=d.orgId,empId=d.empId,month=parseInt(d.month),year=parseInt(d.year),wd=parseInt(d.workingDays)||26;
    var empList=ga(STORE.employees,orgId),emp=null;
    for(var i=0;i<empList.length;i++){if(empList[i].empId===empId){emp=empList[i];break;}}
    if(!emp) return {success:false,error:"Employee not found"};

    var gr=(parseFloat(emp.basicSalary)||0)+(parseFloat(emp.hra)||0)+(parseFloat(emp.otherAllowances)||0);
    var lv=ga(STORE.leaves,orgId),ld=0;
    for(var i=0;i<lv.length;i++){if(lv[i].empId===empId&&lv[i].month===month&&lv[i].year===year){ld=parseFloat(lv[i].leaveDays)||0;break;}}

    var perDay=gr/wd,lded=parseFloat((ld*perDay).toFixed(2)),details=[];
    if(ld>0) details.push({type:"Leave Deduction",description:ld+" day(s) @ \u20b9"+Math.round(perDay)+"/day",amount:lded});

    var advs=ga(STORE.advances,orgId),advDed=0;
    for(var i=0;i<advs.length;i++){
      var a=advs[i];
      if(a.empId!==empId||a.status!=="Active") continue;
      var rem=a.amount-a.totalDeducted;if(rem<=0) continue;
      var ded=(a.deductionType==="scheduled")?Math.min(a.monthlyDeduction,rem):rem;
      ded=parseFloat(ded.toFixed(2));advDed+=ded;
      a.totalDeducted=parseFloat((a.totalDeducted+ded).toFixed(2));
      if(a.totalDeducted>=a.amount) a.status="Cleared";
      details.push({type:a.deductionType==="adhoc"?"Advance (Adhoc)":"Advance (Monthly)",description:a.description,amount:ded});
    }

    var deds=ga(STORE.deductions,orgId),oDed=0;
    for(var i=0;i<deds.length;i++){
      var x=deds[i];
      if(x.empId===empId&&x.month===month&&x.year===year){oDed+=x.amount;details.push({type:"Other Deduction",description:x.description,amount:x.amount});}
    }

    var totDed=parseFloat((lded+advDed+oDed).toFixed(2)),net=parseFloat((gr-totDed).toFixed(2));
    var slip={slipId:"SLIP_"+empId+"_"+month+"_"+year,orgId:orgId,empId:empId,empName:emp.name,
      month:month,year:year,basicSalary:parseFloat(emp.basicSalary)||0,hra:parseFloat(emp.hra)||0,
      otherAllowances:parseFloat(emp.otherAllowances)||0,grossSalary:gr,leaveDays:ld,
      leaveDeduction:lded,advanceDeduction:advDed,otherDeductions:oDed,
      totalDeductions:totDed,netSalary:net,deductionDetails:details,workingDays:wd,
      generatedAt:new Date().toISOString()};

    var slips=ga(STORE.slips,orgId),found=false;
    for(var i=0;i<slips.length;i++){
      if(slips[i].empId===empId&&slips[i].month===month&&slips[i].year===year){slips[i]=slip;found=true;break;}
    }
    if(!found) slips.push(slip);
    return {success:true,slip:slip};
  }

  return {success:false,error:"Unknown: "+ac};
}

// ── REAL API ──────────────────────────────────────────────────
// GAS Web Apps:
//   - doGet  → read operations via query string
//   - doPost → write operations via JSON body
// IMPORTANT: GAS deployed as "Anyone" handles CORS automatically.
// We use no-cors only as a last resort fallback for fire-and-forget writes.

async function gasGet(params){
  // Remove undefined/null/empty params to avoid GAS confusion
  var clean={};
  Object.keys(params).forEach(function(k){
    if(params[k]!==undefined&&params[k]!==null&&params[k]!=="")
      clean[k]=params[k];
  });
  var qs=Object.keys(clean).map(function(k){
    return encodeURIComponent(k)+"="+encodeURIComponent(clean[k]);
  }).join("&");
  var r=await fetch(GAS_URL+"?"+qs,{method:"GET"});
  var data=await r.json();
  return normaliseGasResponse(data);
}

async function gasPost(body){
  var r=await fetch(GAS_URL,{
    method:"POST",
    headers:{"Content-Type":"text/plain"}, // avoid CORS preflight
    body:JSON.stringify(body)
  });
  var data=await r.json();
  return normaliseGasResponse(data);
}

// GAS sometimes returns string-encoded JSON fields — normalise them
function normaliseGasResponse(data){
  if(!data) return {success:false,error:"No response"};
  // If data array contains items with string deductionDetails, parse them
  if(data.data&&Array.isArray(data.data)){
    data.data=data.data.map(function(item){
      if(item&&typeof item.deductionDetails==="string"){
        try{item.deductionDetails=JSON.parse(item.deductionDetails);}catch(e){item.deductionDetails=[];}
      }
      return item;
    });
  }
  // For single slip response
  if(data.slip&&typeof data.slip.deductionDetails==="string"){
    try{data.slip.deductionDetails=JSON.parse(data.slip.deductionDetails);}catch(e){data.slip.deductionDetails=[];}
  }
  return data;
}

var GET_ACTIONS=["getOrganisations","getEmployees","getSalarySlips","getAdvances","getDeductions"];

async function realApi(ac,p){
  p=p||{};
  try{
    if(GET_ACTIONS.indexOf(ac)>-1){
      p.action=ac;
      return await gasGet(p);
    }else{
      p.action=ac;
      return await gasPost(p);
    }
  }catch(e){
    console.error("GAS API error ["+ac+"]:",e);
    return {success:false,error:e.message};
  }
}

async function call(ac,p){ return USE_MOCK?mockApi(ac,p||{}):realApi(ac,p||{}); }

async function fetchAndCacheSlip(orgId,empId,month,year){

}

function fmt(n){return "\u20b9"+parseFloat(n||0).toLocaleString("en-IN",{minimumFractionDigits:2});}
function fmtk(n){return "\u20b9"+parseFloat(n||0).toLocaleString("en-IN");}
function gross(e){return (parseFloat(e.basicSalary)||0)+(parseFloat(e.hra)||0)+(parseFloat(e.otherAllowances)||0);}
function inits(n){return n.split(" ").map(function(w){return w[0];}).join("").slice(0,2).toUpperCase();}

}

async function onSalEmp(empId,reload){
  if(reload===undefined)reload=true;
  S.sf.empId=empId;
  var emp=findEmp(empId);
  var hint=document.getElementById("salHint"),card=document.getElementById("advDedCard");
  if(!emp){if(hint)hint.classList.add("hidden");if(card)card.classList.add("hidden");return;}
  if(hint){hint.classList.remove("hidden");hint.innerHTML='<strong>'+esc(emp.name)+'</strong><br>Gross: <strong>'+fmtk(gross(emp))+'/month</strong><span id="estEl"></span>';}
  if(card)card.classList.remove("hidden");
  updEst();
  // In live mode: fetch slip from GAS to populate cache before checking
  if(!USE_MOCK&&S.selectedOrg){
    var sf=S.sf;
    await fetchAndCacheSlip(S.selectedOrg.orgId,empId,sf.month,sf.year);
  }
  checkExistingSlip();
  if(reload)await loadAdvList(empId);
}

function updEst(){
  var sf=S.sf,emp=findEmp(sf.empId);
  var el=document.getElementById("estEl");if(!el)return;
  if(emp&&parseFloat(sf.leaveDays)>0){
    el.innerHTML='<br><span class="red">Est. leave deduction &asymp; '+fmtk(Math.round(gross(emp)/sf.workingDays*sf.leaveDays))+'</span>';
  }else{el.innerHTML="";}
  // When month/year changes in live mode, re-fetch slip for new period
  if(!USE_MOCK&&S.selectedOrg&&sf.empId){
    fetchAndCacheSlip(S.selectedOrg.orgId,sf.empId,sf.month,sf.year).then(function(){checkExistingSlip();});
  }else{
    checkExistingSlip();
  }
}

function checkExistingSlip(){
  var sf=S.sf;
  var ab=document.getElementById("alreadyBox");
  var ga_el=document.getElementById("genArea");
  if(!ab||!ga_el)return;
  if(!sf.empId){ab.innerHTML="";ga_el.innerHTML='<button class="btn btn-primary" style="width:100%" id="genBtn" onclick="generateSlip()">Generate Salary Slip</button>';return;}

  var existing=existingSlipSync(S.selectedOrg?S.selectedOrg.orgId:"",sf.empId,sf.month,sf.year);
  if(existing){
    ab.innerHTML=
      '<div class="already-box">'+
        '<div class="ab-title">✅ Salary slip already generated</div>'+
        '<div class="ab-sub">'+MONTHS[sf.month-1]+' '+sf.year+' &mdash; Net: <strong>'+fmt(existing.netSalary)+'</strong></div>'+
      '</div>';
    ga_el.innerHTML=
      '<div style="display:flex;gap:8px">'+
        '<button class="btn btn-secondary" style="flex:1" onclick="viewExistingSlip()">'+IC.eye+' View Slip</button>'+
        '<button class="btn btn-red btn-sm" onclick="deleteSlip(\''+existing.slipId+'\')">'+IC.trash+' Delete &amp; Regenerate</button>'+
      '</div>';

    ab.innerHTML="";
    ga_el.innerHTML='<button class="btn btn-primary" style="width:100%" id="genBtn" onclick="generateSlip()">Generate Salary Slip</button>';
  }
}

function viewExistingSlip(){
  var sf=S.sf;

async function generateSlip(){
  var sf=S.sf;
  if(!sf.empId){alert("Please select an employee.");return;}
  var btn=document.getElementById("genBtn");
  if(btn){btn.disabled=true;btn.textContent="Generating\u2026";}
  try{
    var lvRes=await call("recordLeave",{orgId:S.selectedOrg.orgId,empId:sf.empId,
      month:sf.month,year:sf.year,leaveDays:sf.leaveDays,leaveType:sf.leaveType});
    if(lvRes&&lvRes.success===false) throw new Error("Record leave failed: "+(lvRes.error||""));
    var res=await call("generateSalarySlip",{orgId:S.selectedOrg.orgId,empId:sf.empId,
      month:sf.month,year:sf.year,workingDays:sf.workingDays});
    if(!res||res.success===false) throw new Error(res?(res.error||"Failed"):"No response from server");
    var slip=res.slip;
    // Parse deductionDetails if GAS returned it as a JSON string
    if(typeof slip.deductionDetails==="string"){
      try{slip.deductionDetails=JSON.parse(slip.deductionDetails);}catch(e){slip.deductionDetails=[];}
    }
    if(!Array.isArray(slip.deductionDetails)) slip.deductionDetails=[];
    // Normalise all numeric fields
    ["basicSalary","hra","otherAllowances","grossSalary","leaveDays",
     "leaveDeduction","advanceDeduction","otherDeductions","totalDeductions","netSalary"].forEach(function(k){
      slip[k]=parseFloat(slip[k])||0;
    });
    slip.month=parseInt(slip.month); slip.year=parseInt(slip.year);
    slip.workingDays=parseInt(slip.workingDays)||26;
    S.lastSlip=slip;
    // Cache for live mode so checkExistingSlip works without extra round-trip
    if(!USE_MOCK&&S.selectedOrg){
      var ckey=S.selectedOrg.orgId+"_"+sf.empId+"_"+sf.month+"_"+sf.year;
      LIVE_SLIPS_CACHE[ckey]=slip;
    }
    renderSlip(slip); checkExistingSlip(); await loadAdvList(sf.empId);
  }catch(err){
    alert("Error generating salary slip: "+err.message);
    console.error("generateSlip error:",err);
  }
  if(btn){btn.disabled=false;btn.textContent="Generate Salary Slip";}
}

async function renderAdvances(){

  var fBtns=["Active","Cleared","All"].map(function(f){

function setAdvF(f){S.advFilter=f;renderContent();}

async function loadAdvTable(){
  var res=await Promise.all([call("getAdvances",{orgId:S.selectedOrg.orgId}),call("getEmployees",{org:S.selectedOrg.orgId})]);
  var rawAdvs=res[0].data||[],emps=res[1].data||[];
  // Normalise numeric fields from GAS string responses
  var advs=rawAdvs.map(function(a){
    a.amount=parseFloat(a.amount)||0;
    a.totalDeducted=parseFloat(a.totalDeducted)||0;
    a.monthlyDeduction=parseFloat(a.monthlyDeduction)||0;
    return a;
  });
  var nm={};for(var i=0;i<emps.length;i++)nm[emps[i].empId]=emps[i].name;
  var shown=S.advFilter==="All"?advs:advs.filter(function(a){return a.status===S.advFilter;});
  var el=document.getElementById("advTrack");if(!el)return;
  if(!advs.length){el.innerHTML='<div class="empty"><p>No advances recorded yet. Add advances from the Salary &amp; Slips tab.</p></div>';return;}
  if(!shown.length){el.innerHTML='<div class="empty"><p>No '+S.advFilter.toLowerCase()+' advances found.</p></div>';return;}
  var tAmt=0,tDed=0,tRem=0;
  for(var i=0;i<shown.length;i++){tAmt+=shown[i].amount;tDed+=shown[i].totalDeducted;tRem+=(shown[i].amount-shown[i].totalDeducted);}
  el.innerHTML='<table>'+
    '<thead><tr><th>Employee</th><th>Description</th><th>Date</th><th class="tr">Amount</th><th class="tr">Deducted</th><th class="tr">Remaining</th><th>Type</th><th>Status</th></tr></thead>'+
    '<tbody>'+shown.map(function(a){
      var rem=a.amount-a.totalDeducted;
      return '<tr>'+
        '<td class="bold">'+esc(nm[a.empId]||a.empId)+'</td>'+
        '<td><div>'+esc(a.description)+'</div>'+(a.deductionType==="scheduled"?'<div class="muted">\u20b9'+(a.monthlyDeduction||0).toLocaleString("en-IN")+'/mo</div>':"")+
        '</td>'+
        '<td class="muted">'+(a.date?new Date(a.date).toLocaleDateString("en-IN"):"—")+'</td>'+
        '<td class="tr mono">'+fmt(a.amount)+'</td>'+
        '<td class="tr mono green">'+fmt(a.totalDeducted)+'</td>'+
        '<td class="tr mono red">'+fmt(rem)+'</td>'+
        '<td><span class="badge '+(a.deductionType==="adhoc"?"by":"bb")+'">'+esc(a.deductionType)+'</span></td>'+
        '<td><span class="badge '+(a.status==="Active"?"br":"bg")+'">'+esc(a.status)+'</span></td>'+
      '</tr>';
    }).join("")+'</tbody>'+
    '<tfoot><tr><td colspan="3">Total ('+shown.length+' records)</td>'+
      '<td class="tr mono">'+fmt(tAmt)+'</td><td class="tr mono green">'+fmt(tDed)+'</td><td class="tr mono red">'+fmt(tRem)+'</td>'+
      '<td colspan="2"></td></tr></tfoot>'+
  '</table>';
}

// ── MONTHLY REPORT ────────────────────────────────────────────
async function renderReports(){
  var el=document.getElementById("mainContent");
  if(!S.selectedOrg){el.innerHTML='<div class="empty"><p>Select an organisation.</p></div>';return;}
  var rpt=S.rpt;
  var mOpts=MONTHS.map(function(m,i){return '<option value="'+(i+1)+'"'+(rpt.month===i+1?" selected":"")+">"+m+"</option>";}).join("");
  var yOpts=[CY-1,CY,CY+1].map(function(y){return '<option value="'+y+'"'+(rpt.year===y?" selected":"")+">"+y+"</option>";}).join("");

  el.innerHTML=
    '<div class="card">'+
      '<div class="card-header"><h3>Monthly Salary Report &mdash; '+esc(S.selectedOrg.orgName)+'</h3>'+
        '<button class="btn btn-secondary btn-sm no-print" onclick="window.print()">'+IC.print+' Print</button>'+
      '</div>'+
      '<div class="report-filter">'+
        '<label>Month</label>'+
        '<select id="rpt_m" onchange="S.rpt.month=+this.value;loadReport()">'+mOpts+'</select>'+
        '<label style="margin-left:4px">Year</label>'+
        '<select id="rpt_y" onchange="S.rpt.year=+this.value;loadReport()">'+yOpts+'</select>'+
        '<button class="btn btn-primary btn-sm" onclick="loadReport()">Refresh</button>'+
      '</div>'+
      '<div class="rsum" id="rSum"></div>'+
      '<div id="rTable"><div class="empty"><p>Loading&hellip;</p></div></div>'+
    '</div>';
  await loadReport();
}

async function loadReport(){
  var rpt=S.rpt,m=parseInt(rpt.month),y=parseInt(rpt.year);
  var ms=document.getElementById("rpt_m"),ys=document.getElementById("rpt_y");
  if(ms)ms.value=m;if(ys)ys.value=y;
  var rs=document.getElementById("rSum"),rt=document.getElementById("rTable");
  if(rs)rs.innerHTML="";
  if(rt)rt.innerHTML='<div class="empty"><p>Loading&hellip;</p></div>';

  // fetch slips and employees in parallel
  var res=await Promise.all([
    call("getSalarySlips",{orgId:S.selectedOrg.orgId,month:m,year:y}),
    call("getEmployees",{org:S.selectedOrg.orgId})
  ]);
  var rawSlips=res[0].data||[];
  S.employees=res[1].data||[];
  // Normalise slips from GAS (numbers may come as strings, deductionDetails as JSON string)
  var slips=rawSlips.map(function(s){
    if(typeof s.deductionDetails==="string"){
      try{s.deductionDetails=JSON.parse(s.deductionDetails);}catch(e){s.deductionDetails=[];}
    }
    if(!Array.isArray(s.deductionDetails)) s.deductionDetails=[];
    ["basicSalary","hra","otherAllowances","grossSalary","leaveDays",
     "leaveDeduction","advanceDeduction","otherDeductions","totalDeductions","netSalary"].forEach(function(k){
      s[k]=parseFloat(s[k])||0;
    });
    s.month=parseInt(s.month); s.year=parseInt(s.year);
    s.workingDays=parseInt(s.workingDays)||26;
    return s;
  });
  S.reportSlips=slips;

  if(!slips.length){
    if(rs)rs.innerHTML="";
    if(rt)rt.innerHTML='<div class="empty"><p>No salary slips generated for <strong>'+MONTHS[m-1]+' '+y+'</strong>.<br>Generate slips from Salary &amp; Slips tab first.</p></div>';
    return;
  }

  var tG=0,tD=0,tN=0;
  for(var i=0;i<slips.length;i++){tG+=slips[i].grossSalary;tD+=slips[i].totalDeductions;tN+=slips[i].netSalary;}

  if(rs)rs.innerHTML=
    '<div class="rsum-card"><div class="rsum-label">Employees Processed</div><div class="rsum-val">'+slips.length+'</div></div>'+
    '<div class="rsum-card"><div class="rsum-label">Total Gross</div><div class="rsum-val">'+fmtk(tG)+'</div></div>'+
    '<div class="rsum-card"><div class="rsum-label">Total Deductions</div><div class="rsum-val red">'+fmtk(tD)+'</div></div>'+
    '<div class="rsum-card"><div class="rsum-label">Total Net Payable</div><div class="rsum-val green">'+fmtk(tN)+'</div></div>';

  if(!rt)return;
  var deptMap={};for(var i=0;i<S.employees.length;i++)deptMap[S.employees[i].empId]=S.employees[i].department||"—";
  var tLD=0,tAD=0,tOD=0;
  for(var i=0;i<slips.length;i++){tLD+=slips[i].leaveDeduction;tAD+=slips[i].advanceDeduction;tOD+=slips[i].otherDeductions;}

  rt.innerHTML='<table>'+
    '<thead><tr><th>#</th><th>Employee</th><th>Department</th>'+
      '<th class="tr">Gross</th><th class="tr">Leave</th><th class="tr">Advance</th><th class="tr">Other</th><th class="tr">Total Ded.</th><th class="tr">Net Payable</th><th></th>'+
    '</tr></thead>'+
    '<tbody>'+slips.map(function(s,i){
      return '<tr>'+
        '<td class="muted">'+(i+1)+'</td>'+
        '<td><div class="flex gap8"><div class="avt">'+inits(s.empName)+'</div><span class="bold">'+esc(s.empName)+'</span></div></td>'+
        '<td>'+esc(deptMap[s.empId]||"—")+'</td>'+
        '<td class="tr mono">'+fmt(s.grossSalary)+'</td>'+
        '<td class="tr mono red">'+fmt(s.leaveDeduction)+'</td>'+
        '<td class="tr mono red">'+fmt(s.advanceDeduction)+'</td>'+
        '<td class="tr mono red">'+fmt(s.otherDeductions)+'</td>'+
        '<td class="tr mono red bold">'+fmt(s.totalDeductions)+'</td>'+
        '<td class="tr mono green bold">'+fmt(s.netSalary)+'</td>'+
        '<td><button class="btn btn-ghost btn-sm" onclick="viewSlipM('+i+')">'+IC.eye+'</button></td>'+
      '</tr>';
    }).join("")+'</tbody>'+
    '<tfoot><tr><td colspan="3" class="bold">Total</td>'+
      '<td class="tr mono bold">'+fmt(tG)+'</td>'+
      '<td class="tr mono red">'+fmt(tLD)+'</td>'+
      '<td class="tr mono red">'+fmt(tAD)+'</td>'+
      '<td class="tr mono red">'+fmt(tOD)+'</td>'+
      '<td class="tr mono red bold">'+fmt(tD)+'</td>'+
      '<td class="tr mono green bold">'+fmt(tN)+'</td>'+
      '<td></td>'+
    '</tr></tfoot>'+
  '</table>';
}

function viewSlipM(idx){
  var slip=S.reportSlips[idx];if(!slip)return;
  openModal("Salary Slip — "+slip.empName,
    slipHtml(slip,S.selectedOrg?S.selectedOrg.orgName:""),
    '<button class="btn btn-secondary" onclick="closeModal()">Close</button><button class="btn btn-primary btn-sm no-print" onclick="window.print()">'+IC.print+' Print</button>',
    true);
}

// ── SETTINGS ─────────────────────────────────────────────────
function renderSettings(){
  var el=document.getElementById("mainContent");
  var isLive=!USE_MOCK,hasUrl=!!GAS_URL;
  var connHtml="";
  if(isLive&&S.connOk)connHtml='<div class="sbox ok">✅ <strong>Connected to Google Sheets.</strong> All data is live.</div>';
  else if(isLive&&hasUrl)connHtml='<div class="sbox err">❌ Connection failed. Verify the URL and deployment settings.</div>';

  el.innerHTML=
    '<div class="card">'+
      // ── Data Source
      '<div class="settings-section">'+
        '<h3>Data Source</h3>'+
        '<p>Switch between demo mode (local data only, resets on refresh) and Google Sheets (live persistent data via Apps Script).</p>'+
        '<div class="mode-toggle">'+
          '<div class="mode-opt '+(USE_MOCK?"sel":"") +'" id="optDemo">'+
            '<div class="mo-icon">⚡</div>'+
            '<div class="mo-title">Demo Mode</div>'+
            '<div class="mo-sub">No setup needed</div>'+
          '</div>'+
          '<div class="mode-opt '+(!USE_MOCK?"sel":"")+'" id="optLive">'+
            '<div class="mo-icon">🔗</div>'+
            '<div class="mo-title">Google Sheets</div>'+
            '<div class="mo-sub">Live persistent data</div>'+
          '</div>'+
        '</div>'+
      '</div>'+
      // ── URL Input
      '<div class="settings-section" id="gasSection" style="'+(USE_MOCK?"opacity:.5;pointer-events:none":"")+'">'+
        '<h3>Apps Script Web App URL</h3>'+
        '<p>Paste the deployed Web App URL. It is saved locally in your browser and never sent anywhere else.</p>'+
        '<div class="url-row">'+
          '<input type="url" id="gasInput" placeholder="https://script.google.com/macros/s/…/exec" value="'+esc(GAS_URL)+'"/>'+
          '<button class="btn btn-primary" onclick="testConn()">Test &amp; Save</button>'+
        '</div>'+
        '<div id="connResult">'+(connHtml)+'</div>'+
        (hasUrl&&isLive?'<button class="btn btn-secondary btn-sm" style="margin-top:8px" onclick="disconn()">Disconnect</button>':'')+
      '</div>'+
      // ── Guide
      '<div class="settings-section">'+
        '<h3>Setup Guide</h3>'+
        '<p>Follow these steps to connect your Google Sheet:</p>'+
        '<ol class="step-list">'+
          '<li>Open <strong>Google Sheets</strong>, create a new blank spreadsheet (e.g. "HR Manager Data").</li>'+
          '<li>Go to <strong>Extensions → Apps Script</strong>. Delete existing code and paste the full <code>HR_AppScript.gs</code> content.</li>'+
          '<li>In the script editor, select function <code>setupMasterSheets</code> and click <strong>Run ▶</strong>. Authorise when prompted. This creates all sheet tabs.</li>'+
          '<li>Click <strong>Deploy → New Deployment</strong>. Choose type <em>Web App</em>. Set <em>Execute as</em> = <strong>Me</strong>, <em>Who has access</em> = <strong>Anyone</strong>. Click Deploy.</li>'+
          '<li>Copy the <strong>Web App URL</strong> from the dialog (starts with <code>https://script.google.com/macros/s/</code>).</li>'+
          '<li>Switch to <em>Google Sheets</em> mode above, paste the URL, click <strong>Test &amp; Save</strong>.</li>'+
        '</ol>'+
        '<div class="sbox warn" style="margin-top:6px">⚠️ After editing Apps Script code you must create a <strong>New Deployment</strong> each time — re-deploying generates a new URL. Paste the updated URL here.</div>'+
      '</div>'+
    '</div>';

  // attach onclick via addEventListener to avoid inline quoting issues
  var optDemo=document.getElementById("optDemo");
  var optLive=document.getElementById("optLive");
  if(optDemo)optDemo.addEventListener("click",function(){selectMode("demo");});
  if(optLive)optLive.addEventListener("click",function(){selectMode("live");});
}

function selectMode(mode){
  USE_MOCK=(mode==="demo");
  _cfg.mode=mode;localStorage.setItem("hr_cfg",JSON.stringify(_cfg));
  var od=document.getElementById("optDemo"),ol=document.getElementById("optLive");
  var gs=document.getElementById("gasSection");
  if(od)od.className="mode-opt "+(USE_MOCK?"sel":"");
  if(ol)ol.className="mode-opt "+(!USE_MOCK?"sel":"");
  if(gs)gs.style.cssText=USE_MOCK?"opacity:.5;pointer-events:none":"";
  updateConn();
}

async function testConn(){
  var url=(document.getElementById("gasInput")||{}).value||"";
  url=url.trim();
  if(!url){showCR("err","Please enter the Apps Script URL.");return;}
  if(!url.startsWith("https://script.google.com")){showCR("err","URL must start with https://script.google.com/…");return;}
  showCR("info","🔄 Testing connection…");
  try{
    var r=await fetch(url+"?action=getOrganisations");
    if(!r.ok)throw new Error("HTTP "+r.status);
    var data=await r.json();
    if(!data||data.success===false)throw new Error(data.error||"Bad response");
    GAS_URL=url;USE_MOCK=false;S.connOk=true;
    _cfg.url=url;_cfg.mode="live";localStorage.setItem("hr_cfg",JSON.stringify(_cfg));
    updateConn();
    showCR("ok","✅ Connected! Google Sheets is now your data source. Switch to another tab to start using live data.");
    var gs=document.getElementById("gasSection");if(gs)gs.style.cssText="";
    var od=document.getElementById("optDemo"),ol=document.getElementById("optLive");
    if(od)od.className="mode-opt";if(ol)ol.className="mode-opt sel";
  }catch(e){
    S.connOk=false;updateConn();
    showCR("err","❌ Failed: "+e.message+". Make sure deployment is set to 'Anyone can access'.");
  }
}

function showCR(type,msg){var el=document.getElementById("connResult");if(el)el.innerHTML='<div class="sbox '+type+'">'+msg+'</div>';}

function disconn(){
  if(!confirm("Disconnect from Google Sheets and switch to Demo Mode?"))return;
  GAS_URL="";USE_MOCK=true;S.connOk=false;
  _cfg={};localStorage.removeItem("hr_cfg");
  updateConn();renderSettings();
}

// ── ROUTER ────────────────────────────────────────────────────
async function renderContent(){
  var el=document.getElementById("mainContent");
  if(el)el.innerHTML='<div class="empty"><p>Loading&hellip;</p></div>';
  if(S.view==="dashboard") await renderDashboard();
  else if(S.view==="employees") await renderEmployees();
  else if(S.view==="salary") await renderSalary();
  else if(S.view==="advances") await renderAdvances();
  else if(S.view==="reports") await renderReports();
  else if(S.view==="settings") renderSettings();
}

// ── INIT ──────────────────────────────────────────────────────
async function init(){
  if(!USE_MOCK&&GAS_URL) S.connOk=true;
  updateConn();
  var r=await call("getOrganisations");
  if(!USE_MOCK&&(!r||r.success===false)){S.connOk=false;updateConn();}
  S.orgs=r.data||[];
  S.selectedOrg=S.orgs[0]||null;
  renderOrgSelect();renderNav();
  await renderContent();
}

init();
</script>
